<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A from-scratch bilingual (EN/AR) text editor with a built-in AI assistant. No frameworks, no backend, fully offline.">
  <title>Text Editor</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/ai-panel.css">
  <link rel="stylesheet" href="styles/rtl.css">
</head>
<body>
  <!-- ============ APP SHELL ============ -->
  <div id="app" class="app" data-view="edit">

    <!-- Top Toolbar -->
    <header id="toolbar" class="toolbar" role="toolbar" aria-label="Main toolbar">
      <div class="toolbar-group toolbar-group-file">
        <button class="icon-btn" id="btn-new" data-tip="new" aria-label="New document">
          <svg class="ic" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 10h-5v5h-2v-5H6v-2h5V6h2v5h5v2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-open" data-tip="open" aria-label="Open file">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        </button>
        <button class="icon-btn" id="btn-export" data-tip="export" aria-label="Export file">
          <svg class="ic" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
        <input type="file" id="file-input" accept=".txt,.md,.text,text/plain" style="display:none" aria-hidden="true">
      </div>

      <div class="toolbar-sep"></div>

      <div class="toolbar-group">
        <button class="icon-btn" id="btn-undo" data-tip="undo" aria-label="Undo">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>
        <button class="icon-btn" id="btn-redo" data-tip="redo" aria-label="Redo">
          <svg class="ic" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="toolbar-group">
        <button class="icon-btn" id="btn-fontup" data-tip="zoomIn" aria-label="Increase font size">
          <svg class="ic" viewBox="0 0 24 24"><path d="M7 15h2v-1h3v-2H9V8H7v4H4v2h3v1zm8.5-7.5L14 6v13h2V15h3V6l-1.5 1.5zM9 12V9h6v3h-6z" transform="translate(2,0)"/></svg>
        </button>
        <button class="icon-btn" id="btn-fontdown" data-tip="zoomOut" aria-label="Decrease font size">
          <svg class="ic" viewBox="0 0 24 24"><path d="M7 15h2v-1h3v-2H9V8H7v4H4v2h3v1zm6 0h5v-2h-5v2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-wrap" data-tip="wrapOn" aria-label="Toggle word wrap">
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 5H3v2h18V5zm0 12H8v2h13v-2zm0-6H3v2h18v-2z"/></svg>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="toolbar-group">
        <button class="icon-btn" id="btn-find" data-tip="findReplace" aria-label="Find and replace">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
        <button class="icon-btn" id="btn-outline" data-tip="outline" aria-label="Document outline">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 5h10v2H3V5zm0 4h10v2H3V9zm0 4h10v2H3v-2zm0 4h6v2H3v-2zm10-8h8v2h-8V9zm0 4h8v2h-8v-2zm0 4h8v2h-8v-2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-preview" data-tip="preview" aria-label="Toggle markdown preview">
          <svg class="ic" viewBox="0 0 24 24"><path d="M9 16h6v-1.5H9V16zm0-4h6v-1.5H9V12zm0-3h6V7.5H9V9zM3 5v14h4V5H3zm14 0v14h4V5h-4zM5 7.5h2v9H5v-9zM13 2v20h2V2h-2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-focus" data-tip="focusMode" aria-label="Toggle focus mode">
          <svg class="ic" viewBox="0 0 24 24"><path d="M5 5h5V3H3v7h2V5zm14 0v5h2V3h-7v2h5zm0 14h-5v2h7v-7h-2v5zM5 19h5v2H3v-7h2v5z"/></svg>
        </button>
      </div>

      <div class="toolbar-group toolbar-group-attach toolbar-group-language">
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button class="icon-btn lang-btn active" id="btn-lang-en" data-tip="uiEnglish" aria-label="English UI">
            <span class="lang-code">EN</span>
          </button>
          <button class="icon-btn lang-btn" id="btn-lang-ar" data-tip="uiArabic" aria-label="Arabic UI">
            <span class="lang-code">ع</span>
          </button>
        </div>
      </div>

      <div class="toolbar-sep"></div>

      <div class="toolbar-group">
        <button class="icon-btn" id="btn-help" data-tip="shortcuts" aria-label="Shortcuts help">
          <svg class="ic" viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16a7 7 0 0 0-7 7h2a5 5 0 1 1 5 5v2h2v-3a7 7 0 0 0 6-6.9A7 7 0 0 0 12 2z"/></svg>
        </button>
        <button class="icon-btn btn-ai-toggle" id="btn-ai-toggle" data-tip="aiAssistant" aria-label="Toggle AI assistant">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 2l1.6 4.4L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.6L12 2zm6 10l.9 2.5L21.5 15l-2.6.9L18 18.5l-.9-2.6L14.5 15l2.6-.9L18 12zM8 13l1.1 3L12 17l-2.9 1L8 21l-1.1-3L4 17l2.9-1L8 13z"/></svg>
        </button>
      </div>
    </header>

    <!-- Tab bar -->
    <nav id="tabbar" class="tabbar" role="tablist" aria-label="Documents"></nav>

    <!-- Main content area -->
    <main class="main">
      <!-- Editor pane (contains gutter + viewport) -->
      <section id="editor-pane" class="editor-pane" aria-label="Editor">
        <div id="gutter" class="gutter" aria-hidden="true"></div>
        <div id="viewport" class="viewport" role="textbox" aria-multiline="true" aria-label="Text editor" tabindex="0">
          <div id="lines" class="lines"></div>
          <div id="selection-layer" class="selection-layer" aria-hidden="true"></div>
          <div id="caret" class="caret" aria-hidden="true"></div>
          <!-- hidden input to capture text-entry / IME events -->
          <textarea id="input-proxy" class="input-proxy" aria-hidden="true" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <!-- Find & Replace bar -->
        <div id="findbar" class="findbar hidden" role="dialog" aria-label="Find and replace"></div>
      </section>

      <!-- Outline / Preview side pane -->
      <aside id="sidepane" class="sidepane hidden" aria-label="Side pane">
        <div id="outline-pane" class="pane-content hidden"></div>
        <div id="preview-pane" class="pane-content hidden preview-pane"></div>
      </aside>

      <!-- AI assistant panel -->
      <aside id="ai-panel" class="ai-panel" aria-label="AI assistant" aria-hidden="true">
        <div class="ai-panel-header">
          <span class="ai-panel-title" id="ai-panel-title">AI Assistant</span>
          <div class="ai-panel-header-actions">
            <button class="icon-btn" id="btn-ai-settings" data-tip="aiSettings" aria-label="AI settings">
              <svg class="ic" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.61 3.61 0 0 1 12 15.6z"/></svg>
            </button>
            <button class="icon-btn" id="btn-ai-close" data-tip="close" aria-label="Close AI panel">
              <svg class="ic" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>
        <div id="ai-chat" class="ai-chat"></div>
        <div class="ai-input-area">
          <div id="ai-quick" class="ai-quick"></div>
          <div class="ai-input-row">
            <textarea id="ai-input" class="ai-input" rows="1" placeholder="Ask the assistant about your document..."></textarea>
            <button class="icon-btn send-btn" id="btn-ai-send" data-tip="send" aria-label="Send message">
              <svg class="ic" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Status bar -->
    <footer id="statusbar" class="statusbar" role="status" aria-live="polite">
      <span id="status-lncol" class="status-item">Ln 1, Col 1</span>
      <span class="status-item status-sep"></span>
      <span id="status-words" class="status-item">0 words</span>
      <span class="status-item status-sep"></span>
      <span id="status-chars" class="status-item">0 chars</span>
      <span class="status-item status-sep"></span>
      <span id="status-dir" class="status-item">LTR</span>
      <span class="status-spacer"></span>
      <span id="status-save" class="status-item status-save">Saved</span>
    </footer>

    <!-- Shortcut cheat-sheet overlay -->
    <div id="shortcuts-modal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Shortcuts"></div>

    <!-- Focus-mode spacer overlay button to exit -->
    <div id="focus-exit" class="hidden"></div>
  </div>

  <!-- Toast/notifications container -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- First-run intro tour -->
  <div id="tour" class="tour hidden"></div>

  <!-- Module script -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
