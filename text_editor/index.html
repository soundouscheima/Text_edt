<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A from-scratch bilingual (EN/AR) text editor with a built-in AI assistant. No frameworks, no backend, fully offline.">
  <title>Text Editor</title>
  <style>
/* ============================================================
   base.css — CSS reset, design tokens (custom properties),
   base element styling, accessibility helpers.

   Design language: "Basalt" — flat, solid, precise. No frosted
   glass, no gradient blobs. Every surface is a crisp layer with
   hairline borders; focus lives on the text itself.
   ============================================================ */

/* ---------- Reset ---------- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-ui);
  font-size: var(--font-size-ui);
  color: var(--color-text);
  background: var(--color-bg-solid);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-ligatures: none;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

textarea, input {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

::selection {
  background: var(--color-selection-bg);
}

:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}

body:not(.using-keyboard) :focus-visible {
  outline: none;
}

/* ---------- Design tokens (light theme = default) ---------- */
:root {
  /* Typography */
  --font-ui: 'Segoe UI', 'System UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --font-editor: 'JetBrains Mono', 'Fira Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace;
  --font-editor-ar: 'Noto Naskh Arabic', 'Amiri', 'Cairo', 'Segoe UI', 'JetBrains Mono', Consolas, monospace;
  --font-size-ui: 13.5px;
  --font-size-editor: 16px;
  --font-size-line-num: 11.5px;

  /* Spacing */
  --toolbar-h: 46px;
  --tabbar-h: 36px;
  --status-h: 26px;
  --gutter-w: 46px;
  --panel-w: 340px;
  --sidepane-w: 300px;
  --findbar-h: 54px;

  /* Editor metrics */
  --line-height: 1.5;
  --editor-pad: 8px;

  /* Z-index scale */
  --z-lines: 1;
  --z-selection: 2;
  --z-caret: 3;
  --z-findbar: 10;
  --z-status: 20;
  --z-tabbar: 30;
  --z-toolbar: 40;
  --z-sidepane: 45;
  --z-ai-panel: 50;
  --z-overlay: 100;
  --z-toasts: 110;
  --z-tour: 120;

  /* Motion */
  --anim-fast: 120ms;
  --anim-med: 220ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* ---------- Light theme tokens ---------- */
:root {
  --color-bg-solid: #eef1f5;
  --color-bg: #f8fafc;
  --color-bg-elev: #ffffff;
  --color-bg-elev2: #f4f6fa;
  --color-editor-bg: #ffffff;
  --color-bg-hover: rgba(30, 58, 82, 0.06);
  --color-bg-active: rgba(30, 58, 82, 0.11);

  --color-text: #1b2634;
  --color-text-dim: #5d6b7e;
  --color-border: rgba(28, 48, 71, 0.14);
  --color-border-strong: rgba(28, 48, 71, 0.24);

  --color-accent: #0e9483;
  --color-accent-rgb: 14, 148, 131;
  --accent-gradient: linear-gradient(135deg, #0e9483, #16b8a0 55%, #14b8c2);
  --color-accent-soft: rgba(14, 148, 131, 0.12);
  --color-accent-text: #ffffff;

  --color-selection-bg: rgba(14, 148, 131, 0.26);
  --color-caret: #0e7a8f;
  --color-gutter-text: #9aa7b8;
  --color-gutter-bg: #f4f6fa;
  --color-current-line: rgba(14, 148, 131, 0.07);

  --color-error: #d64545;
  --color-error-bg: rgba(214, 69, 69, 0.1);
  --color-success: #16805a;
  --color-success-bg: rgba(22, 128, 90, 0.12);
  --color-warning: #b06a11;
  --color-warning-bg: rgba(240, 168, 62, 0.18);

  --color-find-match: rgba(255, 193, 84, 0.5);
  --color-find-match-active: rgba(255, 151, 40, 0.72);

  --color-ai-user-msg: linear-gradient(135deg, #0e9483, #16b8a0);
  --color-ai-user-msg-bg: rgba(14, 148, 131, 0.12);
  --color-ai-assistant-msg: #ffffff;

  --color-scrollbar: rgba(60, 80, 105, 0.28);
  --color-scrollbar-hover: rgba(60, 80, 105, 0.48);

  --shadow-1: 0 1px 2px rgba(24, 39, 58, 0.06), 0 1px 3px rgba(24, 39, 58, 0.05);
  --shadow-2: 0 12px 34px rgba(24, 39, 58, 0.14), 0 2px 8px rgba(24, 39, 58, 0.08);
  --shadow-glow: 0 6px 22px rgba(14, 148, 131, 0.3);

  --color-markdown-code: rgba(28, 48, 71, 0.07);
  --color-markdown-blockquote: rgba(14, 148, 131, 0.07);
  --color-table-alt: rgba(28, 48, 71, 0.04);
}

/* ---------- Base element styling ---------- */
ul, ol { list-style: none; }

a { color: var(--color-accent); }

img, svg { vertical-align: middle; }

h1, h2, h3, h4 { line-height: 1.3; }

/* Custom scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--color-scrollbar);
  border-radius: 6px;
  border: 3px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* ---------- Accessibility helpers ---------- */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.hidden { display: none !important; }

.visually-hidden { visibility: hidden; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
/* ============================================================
   layout.css — overall app shell layout: toolbar, tab bar,
   main area, editor pane, side pane, AI panel, status bar.
   Flat solid layers with hairline separation.
   ============================================================ */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--color-bg);
}

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  height: var(--toolbar-h);
  padding: 0 10px;
  background: var(--color-bg-elev);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
  z-index: var(--z-toolbar);
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: thin;
}

.toolbar-sep {
  width: 1px;
  height: 20px;
  background: var(--color-border);
  margin: 0 6px;
  flex-shrink: 0;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.toolbar-group-attach {
  margin-left: auto; /* pushed to the right in LTR */
}

/* In focus mode the toolbar is hidden. */
.app[data-view="focus"] .toolbar { display: none; }
.app[data-view="focus"] .tabbar { display: none; }
.app[data-view="focus"] #statusbar { display: none; }

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex;
  align-items: stretch;
  gap: 3px;
  height: var(--tabbar-h);
  padding: 4px 8px 0;
  background: var(--color-bg-elev2);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  flex-shrink: 0;
  z-index: var(--z-tabbar);
}

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  min-width: 120px;
  max-width: 240px;
  border: 1px solid var(--color-border);
  border-bottom: none;
  border-radius: 9px 9px 0 0;
  background: transparent;
  color: var(--color-text-dim);
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: background var(--anim-fast) var(--ease), color var(--anim-fast) var(--ease),
              border-color var(--anim-fast) var(--ease);
}

.tab::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 2px;
  background: transparent;
  transition: background var(--anim-fast) var(--ease);
}

.tab:hover {
  background: var(--color-bg-hover);
  color: var(--color-text);
  border-color: var(--color-border-strong);
}

.tab.active {
  background: var(--color-editor-bg);
  color: var(--color-text);
  border-color: var(--color-border);
  box-shadow: 0 -1px 3px -1px rgba(0, 0, 0, 0.06);
}

.tab.active::before { background: var(--color-accent); }

.tab .tab-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab .tab-dirty {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-text-dim);
  flex-shrink: 0;
  opacity: 0;
  transition: opacity var(--anim-fast);
}

.tab.dirty .tab-dirty { opacity: 1; background: var(--color-accent); }

.tab .tab-close {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--color-text-dim);
  opacity: 0;
  transition: opacity var(--anim-fast), background var(--anim-fast), color var(--anim-fast);
}

.tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--color-bg-active); color: var(--color-text); }

/* ---------- Main area ---------- */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  position: relative;
  background: var(--color-bg);
}

/* ---------- Editor pane ---------- */
.editor-pane {
  display: flex;
  flex: 1;
  min-width: 0;
  min-height: 0;
  position: relative;
}

.viewport {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: auto;
  outline: none;
  background: var(--color-editor-bg);
  cursor: text;
}

/* ---------- Gutter ---------- */
.gutter {
  flex-shrink: 0;
  width: var(--gutter-w);
  background: var(--color-gutter-bg);
  border-right: 1px solid var(--color-border);
  overflow: hidden;
  user-select: none;
  position: relative;
}

/* ---------- Side pane (outline / preview) ---------- */
.sidepane {
  flex-shrink: 0;
  width: var(--sidepane-w);
  display: flex;
  flex-direction: column;
  background: var(--color-bg-elev);
  border-left: 1px solid var(--color-border);
  overflow: hidden;
  z-index: var(--z-sidepane);
  transition: width var(--anim-med) var(--ease);
}

.sidepane .pane-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

/* ---------- Status bar ---------- */
.statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--status-h);
  padding: 0 14px;
  background: var(--color-bg-elev);
  border-top: 1px solid var(--color-border);
  font-size: 12px;
  color: var(--color-text-dim);
  flex-shrink: 0;
  z-index: var(--z-status);
  user-select: none;
}

.status-item { white-space: nowrap; }

.status-sep { width: 1px; height: 12px; background: var(--color-border); }

.status-spacer { flex: 1; }

.status-save { transition: color var(--anim-fast); }
.status-save.saving { color: var(--color-warning); }
.status-save.saved { color: var(--color-success); }
.status-save.error { color: var(--color-error); }

/* ---------- Overlay (shortcut modal) ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 12, 18, 0.5);
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: overlayIn var(--anim-med) var(--ease);
}

@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ---------- Toasts ---------- */
.toasts {
  position: fixed;
  bottom: calc(var(--status-h) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toasts);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}

.toast {
  background: var(--color-bg-elev);
  color: var(--color-text);
  box-shadow: var(--shadow-2);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 13px;
  max-width: 80vw;
  pointer-events: auto;
  animation: toastIn var(--anim-med) var(--ease);
}

.toast.error { background: var(--color-error-bg); color: var(--color-error); border-color: var(--color-error); }
.toast.success { background: var(--color-success-bg); color: var(--color-success); border-color: var(--color-success); }
.toast.warning { background: var(--color-warning-bg); color: var(--color-warning); border-color: var(--color-warning); }

.toast.out { animation: toastOut var(--anim-fast) var(--ease) forwards; }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
  to { opacity: 0; transform: translateY(8px) scale(0.96); }
}

/* ---------- Focus exit button ---------- */
#focus-exit {
  position: fixed;
  inset: 0;
  z-index: 5;
  cursor: zoom-out;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  :root {
    --sidepane-w: 260px;
    --panel-w: 300px;
  }
  .sidepane { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: var(--shadow-2); }
}

@media (max-width: 640px) {
  .sidebar-hidden-label { display: none; }
  .gutter { display: none; }
  .status-item:nth-last-child(n+3):not(#status-save):not(#status-lncol) { display: none; }
}

@media (max-width: 480px) {
  .toolbar { gap: 0; }
  .toolbar-sep { margin: 0 3px; }
}
/* ============================================================
   editor.css — the text editing surface: lines, gutter,
   selection overlays, caret, find bar, wrapping, fonts.
   ============================================================ */

.lines {
  position: absolute;
  top: 0;
  left: 0;
  min-width: 100%;
  z-index: var(--z-lines);
  will-change: top, left;
}

/* Every rendered visual line is one .vline element. */
.vline {
  position: absolute;
  left: 0;
  white-space: pre;
  unicode-bidi: plaintext;
  padding: 0 var(--editor-pad);
  line-height: var(--line-height, 1.5);
}

/* The caret is a custom blinking div, positioned absolutely, with a
   transform for sub-pixel placement (X can be fractional due to
   variable-width glyph measurement). It is given a 2px width and is
   left-aligned at the exact caret x. */
.caret {
  position: absolute;
  width: 2px;
  border-radius: 1px;
  z-index: var(--z-caret);
  background: var(--color-caret);
  pointer-events: none;
  will-change: transform;
  transition: top 60ms linear, transform 60ms linear;
}

.caret.blink-active { animation: caretBlink 1.1s step-end infinite; }

body.using-keyboard .caret { animation: none; }

@keyframes caretBlink {
  0%, 50% { opacity: 1; }
  50.001%, 100% { opacity: 0; }
}

/* Selection overlay rectangles; each visual row gets one rect.
   RTL rows are flipped via the rtl.css override. */
.selection-layer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: var(--z-selection);
  pointer-events: none;
}

.sel-rect {
  position: absolute;
  background: var(--color-selection-bg);
  border-radius: 2px;
}

/* Gutter line numbers */
.gutter-num {
  position: absolute;
  right: 12px;
  text-align: right;
  font-size: var(--font-size-line-num);
  font-family: var(--font-ui);
  color: var(--color-gutter-text);
  user-select: none;
  cursor: default;
  white-space: nowrap;
}

.gutter-num.current {
  color: var(--color-accent);
  font-weight: 700;
}

/* Current logical line highlight (rendered across all its visual rows). */
.current-line-bg {
  position: absolute;
  left: 0;
  right: 0;
  background: var(--color-current-line);
  z-index: 0;
  pointer-events: none;
}

/* Search match highlights */
.find-match {
  position: absolute;
  background: var(--color-find-match);
  border-radius: 2px;
  z-index: 1;
  pointer-events: none;
}
.find-match.active {
  background: var(--color-find-match-active);
}

/* Line that contains a find match gets highlighted edge markers */
.lines .match-line-edge {
  position: absolute;
  left: 0; right: 0;
  box-shadow: inset 0 0 0 24px transparent;
}

/* ---------- Input proxy ---------- */
/* A nearly-invisible 1px textarea placed at the caret to receive
   native text input + IME composition events. It steals focus back
   after toolbar clicks. */
.input-proxy {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  opacity: 0.011;      /* must stay slightly above 0 so some browsers keep it focusable */
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  overflow: hidden;
  z-index: 0;
  caret-color: transparent;
  white-space: pre;
}

/* ---------- Fonts ---------- */
#lines {
  font-family: var(--font-editor);
  font-size: var(--font-size-editor);
}

body.lang-ar #lines {
  font-family: var(--font-editor-ar);
}

/* Use the same font metrics for measuring canvases. */
.measure-canvas {
  position: absolute;
  visibility: hidden;
  left: -9999px;
  top: 0;
  white-space: pre;
  z-index: -1;
}

/* ---------- Find bar ---------- */
.findbar {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: var(--z-findbar);
  background: var(--color-bg-elev);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: var(--shadow-2);
  padding: 12px 14px;
  width: min(480px, calc(100vw - 20px));
}

.findbar .fb-row { display: flex; gap: 6px; margin-bottom: 6px; }
.findbar input[type="text"] {
  flex: 1;
  min-width: 120px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 7px;
  padding: 6px 10px;
}
.findbar input[type="text"]:focus { border-color: var(--color-accent); }

.fb-count {
  font-size: 12px;
  color: var(--color-text-dim);
  align-self: center;
  white-space: nowrap;
}

.fb-opts {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  padding: 0 2px;
  flex-wrap: wrap;
}

.fb-opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--color-text-dim); }
.fb-opts input { accent-color: var(--color-accent); }

.fb-buttons { display: flex; gap: 4px; align-items: center; }

/* ---------- Markdown preview ---------- */
.preview-pane {
  padding: 24px 22px;
  font-size: 14px;
  line-height: 1.7;
  background: var(--color-editor-bg);
}

.preview-pane h1, .preview-pane h2, .preview-pane h3 {
  margin: 1.4em 0 0.5em;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 0.3em;
}
.preview-pane h1:first-child, .preview-pane h2:first-child, .preview-pane h3:first-child { margin-top: 0; }

.preview-pane p { margin: 0.7em 0; }
.preview-pane ul, .preview-pane ol { padding-inline-start: 1.6em; margin: 0.7em 0; }
.preview-pane ul { list-style: disc; }
.preview-pane ol { list-style: decimal; }
.preview-pane li { margin: 0.25em 0; }
.preview-pane code {
  background: var(--color-markdown-code);
  border-radius: 4px;
  padding: 0.15em 0.4em;
  font-family: var(--font-editor);
  font-size: 0.9em;
}
.preview-pane pre {
  background: var(--color-markdown-code);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  margin: 0.7em 0;
}
.preview-pane pre code { padding: 0; background: none; }
.preview-pane blockquote {
  margin: 0.7em 0;
  padding: 2px 14px;
  border-inline-start: 3px solid var(--color-accent);
  background: var(--color-markdown-blockquote);
  border-radius: 4px;
}
.preview-pane a { text-decoration: underline; }
.preview-pane table { border-collapse: collapse; margin: 0.7em 0; }
.preview-pane th, .preview-pane td { border: 1px solid var(--color-border); padding: 5px 10px; }
.preview-pane tr:nth-child(even) td { background: var(--color-table-alt); }
.preview-pane img { max-width: 100%; border-radius: 4px; }
.preview-pane hr { border: none; border-top: 1px solid var(--color-border); margin: 1.4em 0; }
.preview-pane del { color: var(--color-text-dim); }
.preview-pane :dir(rtl) { direction: rtl; }

/* Outline */
.outline-item {
  padding: 5px 12px;
  color: var(--color-text);
  cursor: pointer;
  font-size: 13px;
  border-radius: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.outline-item:hover { background: var(--color-bg-hover); }
.outline-item.h1 { font-weight: 700; padding-left: 14px; }
.outline-item.h2 { font-weight: 600; padding-left: 28px; }
.outline-item.h3 { font-weight: 500; padding-left: 42px; }
.outline-item .outline-no { color: var(--color-text-dim); margin-right: 8px; font-size: 11px; }

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--color-border);
  font-weight: 600;
  font-size: 13px;
}

/* Markdown split indicator */
.preview-badge {
  position: absolute;
  top: 8px; right: 8px;
  z-index: 6;
  background: var(--color-warning-bg);
  color: var(--color-warning);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  pointer-events: none;
}
/* ============================================================
   themes.css — dark theme via [data-theme="dark"] on <html>.
   "Graphite": deep cool slate surfaces, mint-teal accent.
   ============================================================ */

html[data-theme="dark"] {
  --color-bg-solid: #0e1319;
  --color-bg: #151c25;
  --color-bg-elev: #1b2430;
  --color-bg-elev2: #131a22;
  --color-editor-bg: #111820;
  --color-bg-hover: rgba(255, 255, 255, 0.06);
  --color-bg-active: rgba(255, 255, 255, 0.11);

  --color-text: #e6ecf3;
  --color-text-dim: #8b98a9;
  --color-border: rgba(255, 255, 255, 0.09);
  --color-border-strong: rgba(255, 255, 255, 0.18);

  --color-accent: #2cc9ae;
  --color-accent-rgb: 44, 201, 174;
  --accent-gradient: linear-gradient(135deg, #25b7a2, #2cc9ae 55%, #2fb6c9);
  --color-accent-soft: rgba(44, 201, 174, 0.15);
  --color-accent-text: #06201b;

  --color-selection-bg: rgba(44, 201, 174, 0.3);
  --color-caret: #6fe0cf;
  --color-gutter-text: #5d6c7e;
  --color-gutter-bg: #121920;
  --color-current-line: rgba(44, 201, 174, 0.08);

  --color-error: #ff7d72;
  --color-error-bg: rgba(255, 102, 92, 0.13);
  --color-success: #4fd6a2;
  --color-success-bg: rgba(79, 214, 162, 0.13);
  --color-warning: #e8b25c;
  --color-warning-bg: rgba(232, 178, 92, 0.16);

  --color-find-match: rgba(255, 182, 74, 0.4);
  --color-find-match-active: rgba(255, 148, 40, 0.62);

  --color-ai-user-msg: linear-gradient(135deg, #25b7a2, #2cc9ae);
  --color-ai-user-msg-bg: rgba(44, 201, 174, 0.15);
  --color-ai-assistant-msg: #202a37;

  --color-scrollbar: rgba(255, 255, 255, 0.18);
  --color-scrollbar-hover: rgba(255, 255, 255, 0.34);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.32), 0 1px 3px rgba(0, 0, 0, 0.26);
  --shadow-2: 0 14px 40px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.32);
  --shadow-glow: 0 6px 26px rgba(44, 201, 174, 0.35);

  --color-markdown-code: rgba(255, 255, 255, 0.06);
  --color-markdown-blockquote: rgba(44, 201, 174, 0.08);
  --color-table-alt: rgba(255, 255, 255, 0.03);
}

/* Smooth theme fade — applied only to surfaces, never to the caret
   or selection which must stay crisp during typing. */
html { transition: color-scheme 200ms ease; }
.app { transition: background-color 200ms ease; }

/* Accent-colored button after theme works on both themes via tokens. */
.theme-accent { color: var(--color-accent); }
/* ============================================================
   components.css — shared widgets: icon buttons, tooltips,
   dropdowns, modal, tour, empty states, dialogs.
   ============================================================ */

/* ---------- Icon buttons ---------- */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: var(--color-text-dim);
  transition: background var(--anim-fast) var(--ease), color var(--anim-fast) var(--ease),
              box-shadow var(--anim-fast) var(--ease), transform var(--anim-fast) var(--ease);
  position: relative;
}

.icon-btn:hover { background: var(--color-bg-hover); color: var(--color-text); }
.icon-btn:active { background: var(--color-bg-active); transform: scale(0.94); }
.icon-btn.active {
  background: var(--color-accent-soft);
  color: var(--color-accent);
  box-shadow: inset 0 0 0 1px var(--color-accent);
}

.icon-btn svg.ic {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.lang-switch {
  display: flex;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--color-bg-elev2);
}
.lang-switch .lang-btn { width: 40px; border-radius: 0; }
.lang-switch .lang-btn.active {
  background: var(--color-bg-elev);
  color: var(--color-accent);
  box-shadow: inset 0 0 0 1px var(--color-accent);
}

.lang-code { font-weight: 700; font-size: 12.5px; }

.send-btn {
  background: var(--color-accent-soft);
  color: var(--color-accent);
}
.send-btn:hover { color: var(--color-accent); filter: brightness(1.06); }

/* ---------- Tooltips (data-tip) ---------- */
[data-tip] { position: relative; }

[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) translateY(-4px);
  background: var(--color-bg-solid);
  color: var(--color-text);
  border: 1px solid var(--color-border);
  font-size: 12px;
  padding: 4px 9px;
  border-radius: 6px;
  white-space: nowrap;
  box-shadow: var(--shadow-1);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--anim-fast) var(--ease), transform var(--anim-fast) var(--ease);
  z-index: 9999;
}

[data-tip]:hover::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toolbar [data-tip]::after { top: 100%; }

/* ---------- Toolbar small buttons with labels ---------- */
.text-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: var(--color-bg-elev);
  color: var(--color-text);
  font-size: 12.5px;
  cursor: pointer;
  transition: background var(--anim-fast), border-color var(--anim-fast),
              box-shadow var(--anim-fast);
}
.text-btn:hover { background: var(--color-bg-hover); border-color: var(--color-accent); }
.text-btn.primary {
  background: var(--color-accent);
  background-image: var(--accent-gradient);
  color: var(--color-accent-text);
  border-color: transparent;
  box-shadow: var(--shadow-glow);
  font-weight: 600;
}
.text-btn.primary:hover { filter: brightness(1.06); }

/* ---------- Modal ---------- */
.modal {
  background: var(--color-bg-elev);
  border: 1px solid var(--color-border);
  border-radius: 16px;
  box-shadow: var(--shadow-2);
  max-width: min(680px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn var(--anim-med) var(--ease);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--color-border);
}

.modal-title { font-size: 15px; font-weight: 600; }

.modal-body { padding: 16px 18px; overflow: auto; }

.modal-close { color: var(--color-text-dim); }
.modal-close:hover { color: var(--color-text); background: var(--color-bg-hover); }

/* Shortcut table */
.kbd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.kbd-table th, .kbd-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--color-border); }
.kbd-table th { color: var(--color-text-dim); font-weight: 600; }
.kbd-table tr:last-child td { border-bottom: none; }

kbd {
  display: inline-block;
  min-width: 22px;
  text-align: center;
  background: var(--color-bg-elev2);
  border: 1px solid var(--color-border);
  border-bottom-width: 2px;
  border-radius: 6px;
  padding: 2px 6px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  color: var(--color-text);
  margin: 0 2px;
}

/* ---------- Empty states ---------- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  padding: 24px;
  text-align: center;
  color: var(--color-text-dim);
}

.empty-state .es-icon {
  width: 56px;
  height: 56px;
  opacity: 0.4;
}

/* ---------- Tour ---------- */
.tour {
  position: fixed;
  inset: 0;
  z-index: var(--z-tour);
  pointer-events: none;
}

.tour-bubble {
  position: absolute;
  pointer-events: auto;
  background: var(--color-bg-elev);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-2);
  border-radius: 14px;
  padding: 16px 18px;
  max-width: 320px;
  font-size: 13.5px;
  line-height: 1.5;
  animation: modalIn var(--anim-med) var(--ease);
}

.tour-bubble .tour-title { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }

.tour-bubble .tour-step { color: var(--color-text-dim); font-size: 12px; margin-bottom: 8px; }

.tour-bubble .tour-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

.tour-highlight {
  position: absolute;
  border-radius: 8px;
  box-shadow: 0 0 0 3px var(--color-accent), var(--shadow-2);
  pointer-events: none;
  z-index: var(--z-tour);
  animation: tourPulse 1.4s ease-in-out infinite;
}

@keyframes tourPulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--color-accent), var(--shadow-2); }
  50% { box-shadow: 0 0 0 6px rgba(var(--color-accent-rgb), 0.45), var(--shadow-2); }
}

/* ---------- Version list ---------- */
.version-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  margin-bottom: 8px;
  background: var(--color-bg);
}
.version-item:hover { border-color: var(--color-accent); }
.version-meta { display: flex; flex-direction: column; gap: 2px; }
.version-time { font-size: 13px; font-weight: 600; }
.version-desc { font-size: 11.5px; color: var(--color-text-dim); }

/* ---------- Recent documents ---------- */
.recent-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  margin-bottom: 8px;
  background: var(--color-bg);
  cursor: pointer;
}
.recent-item:hover { border-color: var(--color-accent); background: var(--color-bg-hover); }

/* ---------- Confirm dialog ---------- */
.confirm-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* ---------- Drag overlay ---------- */
.drag-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--color-accent-soft);
  border: 2px dashed var(--color-accent);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--color-accent);
  pointer-events: none;
}
/* ============================================================
   ai-panel.css — the AI assistant slide-in side panel.
   IMPORTANT: `.ai-panel` uses `transform: translateX(110%)` by
   default and slides in via `.ai-panel.open`. The app controls
   visibility with both `.open` (slide-in) on the panel and
   `.ai-closed` (display) on #app — keep those two in sync.
   ============================================================ */

.ai-panel {
  display: flex;
  flex-direction: column;
  width: var(--panel-w);
  flex-shrink: 0;
  background: var(--color-bg-elev);
  border-left: 1px solid var(--color-border);
  z-index: var(--z-ai-panel);
  transform: translateX(110%);
  transition: transform var(--anim-med) var(--ease);
  position: relative;
}

.app.ai-closed .ai-panel { display: none; }

.ai-panel.open { transform: translateX(0); }

.ai-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.ai-panel-title {
  font-weight: 700;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.ai-panel-title::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-accent);
  background-image: var(--accent-gradient);
  box-shadow: 0 0 0 3px var(--color-accent-soft);
}

.ai-panel-header-actions { display: flex; gap: 2px; }

.ai-chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  background: var(--color-bg);
}

.ai-msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 92%;
  animation: msgIn var(--anim-fast) var(--ease);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.ai-msg.user { align-self: flex-end; align-items: flex-end; }
.ai-msg.assistant { align-self: flex-start; align-items: flex-start; }

.ai-msg-bubble {
  padding: 9px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow-1);
}

.ai-msg.user .ai-msg-bubble {
  background: var(--color-ai-user-msg);
  background-image: var(--accent-gradient);
  color: var(--color-accent-text);
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 16px -6px rgba(var(--color-accent-rgb), 0.5);
}

.ai-msg.assistant .ai-msg-bubble {
  background: var(--color-ai-assistant-msg);
  border: 1px solid var(--color-border);
  border-bottom-left-radius: 4px;
}

.ai-msg-actions {
  display: flex;
  gap: 6px;
  font-size: 12px;
}

.ai-msg-actions button {
  color: var(--color-accent);
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  text-decoration: none;
  background: var(--color-accent-soft);
}
.ai-msg-actions button:hover { background: var(--color-accent); color: var(--color-accent-text); }

.ai-msg.error .ai-msg-bubble {
  background: var(--color-error-bg);
  color: var(--color-error);
  border-color: var(--color-error);
}

.ai-msg .ai-prose p { margin: 0.4em 0; }
.ai-msg .ai-prose p:first-child { margin-top: 0; }
.ai-msg .ai-prose p:last-child { margin-bottom: 0; }
.ai-msg .ai-prose pre {
  background: var(--color-markdown-code);
  border-radius: 8px;
  padding: 8px 10px;
  overflow-x: auto;
  font-size: 12px;
  font-family: var(--font-editor);
  margin: 0.4em 0;
}
.ai-msg .ai-prose :is(ul, ol) { padding-inline-start: 1.4em; }
.ai-msg .ai-prose ul { list-style: disc; }
.ai-msg .ai-prose ol { list-style: decimal; }

/* Streaming indicator */
.ai-typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 2px; }
.ai-typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-accent);
  animation: typingBounce 1.2s infinite ease-in-out;
}
.ai-typing span:nth-child(2) { animation-delay: 0.15s; }
.ai-typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Streamed token caret */
.ai-stream-caret {
  display: inline-block;
  width: 2px;
  height: 14px;
  border-radius: 1px;
  background: var(--color-accent);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: caretBlink 1s step-end infinite;
}

/* Quick actions row */
.ai-quick {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0 8px;
  flex-shrink: 0;
  scrollbar-width: thin;
}

.ai-chip {
  flex-shrink: 0;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 14px;
  border: 1px solid var(--color-border);
  background: var(--color-bg-elev);
  color: var(--color-text-dim);
  white-space: nowrap;
  transition: all var(--anim-fast);
}
.ai-chip:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-soft); }

/* Input area */
.ai-input-area {
  border-top: 1px solid var(--color-border);
  padding: 10px 12px;
  flex-shrink: 0;
  background: var(--color-bg-elev);
}

.ai-input-row { display: flex; gap: 8px; align-items: flex-end; }

.ai-input {
  flex: 1;
  resize: none;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 13.5px;
  line-height: 1.5;
  max-height: 140px;
  overflow-y: auto;
}
.ai-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px var(--color-accent-soft);
}

/* Settings view inside panel */
.ai-settings { padding: 14px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; background: var(--color-bg); }

.ai-settings .field { margin-bottom: 14px; }
.ai-settings label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--color-text-dim); }

.ai-settings input[type="text"],
.ai-settings input[type="password"],
.ai-settings select {
  width: 100%;
  background: var(--color-bg-elev);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--color-text);
}
.ai-settings input:focus, .ai-settings select:focus { border-color: var(--color-accent); }

.key-row { display: flex; gap: 6px; }
.key-row input { flex: 1; }

.ai-disclaimer {
  font-size: 11.5px;
  color: var(--color-warning);
  background: var(--color-warning-bg);
  border-radius: 8px;
  padding: 9px 11px;
  line-height: 1.5;
  margin-bottom: 14px;
}

.ai-test-btn { width: 100%; margin-top: 4px; }

.ai-settings .save-note { font-size: 11px; color: var(--color-success); margin-top: 8px; }

/* Empty state for "no provider configured" */
.ai-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 30px 20px;
  text-align: center;
  color: var(--color-text-dim);
}
.ai-empty .es-icon { width: 54px; height: 54px; opacity: 0.4; }
.ai-empty button { color: var(--color-accent); text-decoration: underline; font-size: 13px; }

/* ---------- Responsive: collapse to full-screen overlay ---------- */
@media (max-width: 900px) {
  .ai-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    max-width: 100vw;
    border-left: none;
    box-shadow: var(--shadow-2);
  }
  .ai-panel { border-top: 1px solid var(--color-border); }
}
/* ============================================================
   rtl.css — mirroring rules applied when `dir="rtl"`.
   The editor content renders its own direction via per-line
   `unicode-bidi: plaintext`, but the *chrome* mirrors here.
   ============================================================ */

html[dir="rtl"] {
  direction: rtl;
}

/* Mirror the toolbar's spacer group */
html[dir="rtl"] .toolbar-group-attach { margin-left: 0; margin-right: auto; }

/* Tabs: accent indicator slides to the other side */
html[dir="rtl"] .tab { border-right: none; border-left: 1px solid var(--color-border); }
html[dir="rtl"] .tab.active::before { left: 0; right: 0; }

/* AI panel slides in from the left in RTL */
html[dir="rtl"] .ai-panel {
  border-left: none;
  border-right: 1px solid var(--color-border);
  transform: translateX(-110%);
}
html[dir="rtl"] .ai-panel.open { transform: translateX(0); }

/* Side pane sits on the right in RTL */
html[dir="rtl"] .sidepane { border-left: none; border-right: 1px solid var(--color-border); }

/* Find bar anchors to the left in RTL */
html[dir="rtl"] .findbar { left: 10px; right: auto; }

/* Gutter numbers align to the left edge with the text margin in RTL */
html[dir="rtl"] .gutter { border-right: none; border-left: 1px solid var(--color-border); }
html[dir="rtl"] .gutter-num { right: auto; left: 12px; text-align: left; }

/* Mirror directional icons (arrows point opposite in RTL) */
html[dir="rtl"] .btn.ai-mirror svg { transform: scaleX(-1); }

/* Overlay modal scrollbars */
html[dir="rtl"] .modal-body { direction: rtl; }

/* Table alignment for shortcut cheat-sheet */
html[dir="rtl"] .kbd-table th, html[dir="rtl"] .kbd-table td { text-align: right; }

/* RTL selection rects: the selection highlight is anchored from the
   *right* edge. Overridden by renderer via inline styles for mixed runs;
   this handles pure-RTL lines. */
html[dir="rtl"] .sel-rect { transform-origin: right center; }

/* Input proxy must not mirror — it's position:absolute and 1px,
   but ensure caret-direction doesn't drift it. */
html[dir="rtl"] .input-proxy { direction: ltr; }

/* Tooltips should flip from their left offset in RTL mode */
html[dir="rtl"] [data-tip]::after { left: auto; right: 50%; transform: translateX(50%) translateY(-4px); }
html[dir="rtl"] [data-tip]:hover::after { transform: translateX(50%) translateY(0); }

/* Chat bubbles: user messages right, assistant messages left in RTL */
html[dir="rtl"] .ai-msg.user { align-self: flex-start; align-items: flex-start; }
html[dir="rtl"] .ai-msg.assistant { align-self: flex-end; align-items: flex-end; }
html[dir="rtl"] .ai-msg.user .ai-msg-bubble { border-bottom-left-radius: 4px; border-bottom-right-radius: 12px; }
html[dir="rtl"] .ai-msg.assistant .ai-msg-bubble { border-bottom-right-radius: 4px; border-bottom-left-radius: 12px; }

/* Status bar item order: flex already flips with dir. */
  </style>

/* ===== util.js ===== */
/* ============================================================
   util.js — dependency-free helpers: Unicode segmentation,
   word boundaries (Latin + Arabic), bidi/RTl detection,
   misc formatting & DOM helpers.
   ============================================================ */

/* ---- Grapheme segmentation ---------------------------------
   Intl.Segmenter('en', {granularity:'grapheme'}) treats a
   grapheme cluster as the user-perceived "character". This is what
   we use for Left/Right/Backspace and click-to-position so an
   Arabic diacritic or an emoji ZWJ sequence moves the caret whole.
   If Intl.Segmenter is unavailable (very old browsers) we degrade
   to code-unit stepping. */
const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
  ? new Intl.Segmenter(undefined, { granularity: 'grapheme', localeMatcher: 'lookup' })
  : null;

/** Cached segmentation of a string (position cache). */
export function iterGraphemes(text, start = 0, end = text.length) {
  if (segmenter) {
    return segmenter.segment(text.slice(start, end));
  }
  return null;
}

export function hasSegmentation() { return !!segmenter; }

/** Offset of the grapheme boundary BEFORE index (prev visual char). */
export function prevGrapheme(text, index) {
  if (index <= 0) return 0;
  if (!segmenter) return index - 1;
  const start = Math.max(0, index - 12);
  const it = segmenter.segment(text.slice(start, index))[Symbol.iterator]();
  let prev = start;
  for (let g = it.next(); !g.done; g = it.next()) prev = start + g.value.index;
  return prev;
}

/** Offset of the grapheme boundary AFTER index (next visual char). */
export function nextGrapheme(text, index) {
  if (index >= text.length) return text.length;
  if (!segmenter) return index + 1;
  const it = segmenter.segment(text.slice(index))[Symbol.iterator]();
  const g = it.next();
  if (g.done) return text.length;
  return index + g.value.segment.length;
}

/* ---- Word boundaries ---------------------------------------- */

/** Latin letters, Arabic letters, digits, underscore, combining marks. */
export function isWordChar(ch) {
  if (!ch) return false;
  const c = ch.codePointAt(0);
  // ASCII letters & digits
  if (c >= 48 && c <= 57) return true;
  if (c >= 65 && c <= 90) return true;
  if (c >= 97 && c <= 122) return true;
  if (c === 95) return true;
  // Arabic block + Arabic presentation forms + combining diacritics
  if (c >= 0x0600 && c <= 0x06FF) return true;
  if (c >= 0x0750 && c <= 0x077F) return true;
  if (c >= 0x08A0 && c <= 0x08FF) return true;
  if (c >= 0xFB50 && c <= 0xFDFF) return true;
  if (c >= 0xFE70 && c <= 0xFEFF) return true;
  if (c >= 0x0300 && c <= 0x036F) return true;
  // Extended Latin
  if (c >= 0xC0 && c <= 0x2AF) return true;
  return false;
}

/** Index of the start of the word containing `index` (exclusive).
    index is a UTF-16 offset. */
export function wordStart(text, index) {
  while (index > 0 && isWordChar(text[index - 1])) index--;
  return index;
}

/** Index just past the end of the word containing `index`. */
export function wordEnd(text, index) {
  const n = text.length;
  while (index < n && isWordChar(text[index])) index++;
  return index;
}

export function isWordCharAt(text, index) {
  return index >= 0 && index < text.length && isWordChar(text[index]);
}

/* ---- Arabic / RTL detection ---------------------------------- */

export function isArabicCharCode(cp) {
  return (cp >= 0x0600 && cp <= 0x06FF) ||
         (cp >= 0x0750 && cp <= 0x077F) ||
         (cp >= 0x08A0 && cp <= 0x08FF) ||
         (cp >= 0xFB50 && cp <= 0xFDFF) ||
         (cp >= 0xFE70 && cp <= 0xFEFF);
}

/** Weighted majority direction heuristic for a line of text.
    Returns 'rtl' | 'ltr' | 'neutral'. Counts strong-direction
    characters, ignoring digits and punctuation. */
export function detectLineDirection(text) {
  let rtl = 0, ltr = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    if (isArabicCharCode(cp)) rtl++;
    else if ((cp >= 0x0041 && cp <= 0x005A) ||
             (cp >= 0x0061 && cp <= 0x007A) ||
             (cp >= 0x00C0 && cp <= 0x02AF)) ltr++;
  }
  if (rtl > ltr) return 'rtl';
  if (ltr > rtl) return 'ltr';
  return 'neutral';
}

/* ---- Misc ----------------------------------------------------- */

export function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

export function debounce(fn, ms) {
  let t = null;
  const d = (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
  d.cancel = () => clearTimeout(t);
  d.flush = () => { if (t) { clearTimeout(t); fn(); } };
  return d;
}

export function throttle(fn, ms) {
  let last = 0, t = null;
  const th = (...args) => {
    const now = Date.now();
    const wait = ms - (now - last);
    if (wait <= 0) { last = now; fn(...args); }
    else if (!t) t = setTimeout(() => { last = Date.now(); t = null; fn(...args); }, wait);
  };
  th.cancel = () => { clearTimeout(t); t = null; };
  return th;
}

export function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

export function formatNumber(n) { return n.toLocaleString(); }

/** Trigger a Blob download purely client-side. */
export function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

export function readingTime(text) {
  const words = (text.trim().match(/\S+/g) || []).length;
  const cpm = 220;
  const mins = Math.max(1, Math.round(words / cpm));
  if (mins < 1) return '~1 min';
  return `${mins} min`;
}

export function samePosition(a, b) { return a.line === b.line && a.column === b.column; }

/* Deterministic-ish random id. */
export function uid(prefix = '') {
  return prefix + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

export { };

   i18n.js — English/Arabic UI dictionary + RTL/LTR switching.

   Every user-facing string in the app goes through t('key').
   No hardcoded UI strings anywhere else in the codebase.
   Switching locale:
     - re-renders all [data-i18n] elements,
     - sets document.documentElement dir + lang,
     - so the entire chrome (toolbar order, scrollbars, panel
       slide-in side) mirrors correctly via rtl.css.
   The DOCUMENT content direction is independent of the UI
   language (handled per-line by the renderer).
   ============================================================ */

const dicts = { en, ar };

let current = 'en';
let countF = null; // formatter for plural, unused placeholder

let listeners = [];

class I18n {
  constructor() { this.locale = 'en'; }

  t(key, vars = {}) {
    const d = dicts[this.locale] || dicts.en;
    let s = d[key] ?? dicts.en[key] ?? key;
    for (const [k, v] of Object.entries(vars)) {
      s = s.replace(new RegExp(`\\{${k}\\}`, 'g'), String(v));
    }
    return s;
  }

  setLocale(loc) {
    if (!dicts[loc]) loc = 'en';
    this.locale = loc;
    document.documentElement.lang = loc;
    document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-ar', loc === 'ar');
    localStorage.setItem('te.lang', loc);
    for (const fn of listeners) fn(loc);
  }

  getLocale() { return this.locale; }

  onChanged(fn) { listeners.push(fn); }

  /** Translate all [data-i18n] elements + tooltips + placeholders. */
  applyDom(root = document) {
    root.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      el.textContent = this.t(k);
    });
    root.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = this.t(el.getAttribute('data-i18n-title'));
      el.setAttribute('aria-label', this.t(el.getAttribute('data-i18n-title')));
    });
    // data-tip tooltips (already rendered by CSS ::after using attr)
    root.querySelectorAll('[data-tip]').forEach(el => {
      el.setAttribute('data-tip', this.t(el.getAttribute('data-tip')));
    });
    root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.setAttribute('placeholder', this.t(el.getAttribute('data-i18n-placeholder')));
    });
  }
}

export const i18n = new I18n();

/* ===== buffer.js ===== */
/* ============================================================
   buffer.js — the heart of the editor.

   DATA STRUCTURE CHOICE: PIECE TABLE
   -----------------------------------
   We use a classic *piece table* for the document text.

   Why a piece table (and why it beats a big string):
   -----------------------------------------------------
   1) A naive implementation stores the doc as one JS string and
      does `str = str.slice(0,p) + ins + str.slice(p)` per keystroke.
      That is O(n) per edit (n = document length) and O(n²) total
      for a session — it visibly janks on documents with thousands
      of lines.
   2) A GAP BUFFER (array + movable gap) is cursor-centric: edits
      at the cursor are O(1), but editing far from the cursor
      requires moving the gap, and rendering/word-wrap still need a
      full scan.
   3) A ROPE (balanced tree of string chunks) is excellent for
      huge files and for sharing structure across undo versions,
      but is considerably more code and only pays off for
      documents well into the tens-of-MBs range.
   4) The PIECE TABLE (used historically by VS Code / Word) keeps
      every edit O(pieces touched) regardless of WHERE it happens
      (start, middle or end of a 10k-line file) and renders by
      walking only visible pieces. Undo/redo can restore the piece
      *list* without copying any text (see commands.js/history.js).

   Layout
   ------
   - original: one immutable string (the file as first loaded).
   - add:      an append-only array of string chunks. Every edit
               appends a new chunk at the end. Chunks are never
               mutated; this makes undo structural, not textual.
   - pieces:   an ordered array of descriptors
               { src: 'ori'|'add', start, len } that tiles the
               logical document. The document is the concatenation
               of pieces in order.

   Operations & complexity (n = doc length, p = #pieces):
   - insert(offset,text): split one piece and splice a new ADD
       piece in                          O(p) worst, O(1) typical
   - delete(offset,len):  trim/split/remove covering pieces  O(p)
   - getText():           concatenate all pieces               O(n)
   - getLine(i):          walk pieces, usually a small slice     O(p)
   - line<->offset:       binary search line-starts            O(log L)

   For a 10k-line doc, p stays in the low tens during a typing
   burst because adjacent ADD pieces referencing the same chunk
   are merged; each keystroke therefore touches a handful of small
   objects instead of copying hundreds of KB of string.

   Note on encoding: all offsets are UTF-16 code units (JS string
   semantics). Grapheme-safe movement for Arabic diacritics / emoji
   is handled by the cursor/input layer via Intl.Segmenter, not in
   the buffer.

   Line index: we keep a sorted array of line-start offsets and
   rebuild it on edit (O(n) one scan, tiny constant). Cached visual
   rows in the renderer make this invisible. A balanced tree would
   scale to 10⁶+ lines; documented tradeoff accepted for simplicity.
   ============================================================ */

const ORI = 'ori';
const ADD = 'add';

class PieceTableBuffer {
  constructor(initialText = '') {
    this._original = initialText;
    this._add = [];                 // append-only chunks
    this._pieces = [];
    if (initialText.length > 0) {
      this._pieces.push({ src: ORI, start: 0, len: initialText.length });
    }
    this._lineStarts = [0];
    this._version = 0;
    this._rebuildLineStarts();
  }

  /* ------------------------------------------------ */
  /* Internal helpers                                 */
  /* ------------------------------------------------ */

  getTotalLength() {
    let n = 0;
    for (const p of this._pieces) n += p.len;
    return n;
  }

  /** Text of a single piece span. */
  _pieceText(piece) {
    if (piece.src === ORI) {
      return this._original.substr(piece.start, piece.len);
    }
    return this._add[piece.chunk].substr(piece.start, piece.len);
  }

  /** Start offset of piece 'index'. */
  _pieceIxStart(index) {
    let acc = 0;
    for (let i = 0; i < index; i++) acc += this._pieces[i].len;
    return acc;
  }

  /** Index of the piece containing 'offset'. */
  _pieceIndexAt(offset) {
    let lo = 0, hi = this._pieces.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (offset >= this._pieceIxStart(mid) + this._pieces[mid].len) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  _snapshotPieces() {
    return this._pieces.map(p => ({ src: p.src, chunk: p.chunk, start: p.start, len: p.len }));
  }

  _restorePieces(pieces) {
    this._pieces = pieces.map(p => ({ src: p.src, chunk: p.chunk, start: p.start, len: p.len }));
    this._afterEdit();
  }

  /** Merge adjacent pieces that describe contiguous spans within the
      SAME source. ORI pieces are contiguous when start+len of one
      equals the start of the next. ADD pieces may only be merged when
      they reference the same chunk AND the combined span still fits
      inside that chunk (one chunk = one insert's text, so spans that
      tile the same chunk without gaps are safe to join). This keeps
      the piece list small during typing bursts. */
  _mergeAdjacent() {
    const out = [];
    for (const p of this._pieces) {
      const last = out[out.length - 1];
      if (last && last.src === p.src &&
          ((p.src === ORI && last.start + last.len === p.start) ||
           (p.src === ADD && last.chunk === p.chunk && last.start + last.len === p.start))) {
        const chunk = (p.src === ADD) ? this._add[last.chunk] : undefined;
        if (p.src === ORI || (chunk !== undefined && last.start + last.len + p.len <= chunk.length)) {
          last.len += p.len;
          continue;
        }
      }
      out.push({ src: p.src, chunk: p.chunk, start: p.start, len: p.len });
    }
    this._pieces = out;
  }

  /* ------------------------------------------------ */
  /* Edits                                            */
  /* ------------------------------------------------ */

  /**
   * Insert `text` at document offset `offset`.
   * Returns a descriptor {before, after} that undo/redo can replay.
   */
  insert(offset, text) {
    if (!text || text.length === 0) return null;
    const before = this._snapshotPieces();

    // Append text to the add buffer (never mutated again).
    const chunkIdx = this._add.push(text) - 1;

    const total = this.getTotalLength();
    offset = Math.max(0, Math.min(offset, total));

    if (this._pieces.length === 0) {
      this._pieces.push({ src: ADD, chunk: chunkIdx, start: 0, len: text.length });
    } else {
      const idx = this._pieceIndexAt(offset);
      const pieceStart = this._pieceIxStart(idx);

      if (offset === pieceStart) {
        // Insert before piece `idx` (splice insert point).
        const newPiece = { src: ADD, chunk: chunkIdx, start: 0, len: text.length };
        this._pieces.splice(idx, 0, newPiece);
      } else if (idx >= this._pieces.length) {
        // Append at very end of document.
        this._pieces.push({ src: ADD, chunk: chunkIdx, start: 0, len: text.length });
        this._mergeAdjacent();
      } else {
        // Split the containing piece. ADD pieces carry an explicit
        // start INSIDE their chunk, so a split is exact.
        const found = this._pieces[idx];
        const local = offset - pieceStart;
        const head = { src: found.src, chunk: found.chunk, start: found.start, len: local };
        const tail = { src: found.src, chunk: found.chunk, start: found.start + local, len: found.len - local };
        this._pieces.splice(idx, 1, head,
                            { src: ADD, chunk: chunkIdx, start: 0, len: text.length },
                            tail);
      }
    }

    this._afterEdit();
    return { before, after: this._snapshotPieces() };
  }

  /**
   * Delete `length` code units starting at `offset`.
   * Returns a descriptor for undo/redo.
   *
   * Implementation: rebuild the piece list in ONE pass (no in-place
   * splices). Each piece's absolute span is tracked with a running
   * accumulator, so removals never shift the bookkeeping of the
   * pieces we haven't visited yet.
   */
  delete(offset, length) {
    if (length <= 0) return null;
    const before = this._snapshotPieces();
    const total = this.getTotalLength();
    offset = Math.max(0, Math.min(offset, total));
    length = Math.min(length, total - offset);
    const end = offset + length;

    const out = [];
    let acc = 0;
    for (const piece of this._pieces) {
      const ps = acc;              // absolute start of this piece
      const pe = ps + piece.len;   // absolute end of this piece
      if (pe <= offset || ps >= end) {
        out.push(piece);           // untouched by the deletion
        acc = pe;
        continue;
      }
      const keepHead = offset - ps;
      const keepTail = pe - end;
      if (keepHead > 0) out.push({ src: piece.src, chunk: piece.chunk, start: piece.start, len: keepHead });
      if (keepTail > 0) out.push({ src: piece.src, chunk: piece.chunk, start: piece.start + (piece.len - keepTail), len: keepTail });
      acc = pe;
    }

    this._pieces = out;
    this._mergeAdjacent();
    this._afterEdit();
    return { before, after: this._snapshotPieces() };
  }

  /** Revert to the pre-edit state described by a descriptor. */
  undo(desc) {
    if (desc && desc.before) this._restorePieces(desc.before);
  }

  /** Re-apply the edit described by a descriptor. */
  redo(desc) {
    if (desc && desc.after) this._restorePieces(desc.after);
  }

  /* ------------------------------------------------ */
  /* Reads                                            */
  /* ------------------------------------------------ */

  /** Full (or partial) document text. O(n). */
  getText(start = 0, length = null) {
    const total = this.getTotalLength();
    if (length === null) length = total - start;
    length = Math.max(0, Math.min(length, total - start));
    if (length <= 0) return '';

    let out = '';
    let i = start === 0 ? 0 : this._pieceIndexAt(start);
    let pos = start;
    let remaining = length;

    while (remaining > 0 && i < this._pieces.length) {
      const piece = this._pieces[i];
      const ps = this._pieceIxStart(i);
      const local = pos - ps;
      const take = Math.min(piece.len - local, remaining);
      out += this._readChunk(piece, local, take);
      remaining -= take;
      pos += take;
      i++;
    }
    return out;
  }

  _readChunk(piece, start, length) {
    // `start` is the offset INSIDE the piece; combine it with the
    // piece's own start within its source chunk.
    if (piece.src === ORI) return this._original.substr(piece.start + start, length);
    return this._add[piece.chunk].substr(piece.start + start, length);
  }

  getLineCount() { return this._lineStarts.length; }

  /** Text of logical line i, without trailing '\n'. */
  getLine(i) {
    if (i < 0 || i >= this._lineStarts.length) return '';
    const s = this._lineStarts[i];
    const e = (i + 1 < this._lineStarts.length) ? this._lineStarts[i + 1] : this.getTotalLength();
    return this.getText(s, e - s).replace(/\n$/, '');
  }

  /** Length of logical line i, excluding '\n'. */
  getLineLength(i) {
    if (i < 0 || i >= this._lineStarts.length) return 0;
    const s = this._lineStarts[i];
    const e = (i + 1 < this._lineStarts.length) ? this._lineStarts[i + 1] : this.getTotalLength();
    return e - s - (e > s && e - s > 0 && this.getText(e - 1, 1) === '\n' ? 1 : 0);
  }

  /* ------------------------------------------------ */
  /* Line index                                       */
  /* ------------------------------------------------ */

  _rebuildLineStarts() {
    this._lineStarts = [0];
    const text = this.getText();
    for (let i = 0; i < text.length; i++) {
      if (text.charCodeAt(i) === 10) this._lineStarts.push(i + 1);
    }
  }

  _afterEdit() {
    this._version++;
    this._rebuildLineStarts();
  }

  /* ------------------------------------------------ */
  /* offset <-> line/column                          */
  /* ------------------------------------------------ */

  offsetToLineColumn(offset) {
    offset = Math.max(0, Math.min(offset, this.getTotalLength()));
    let lo = 0, hi = this._lineStarts.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (this._lineStarts[mid] > offset) hi = mid;
      else lo = mid + 1;
    }
    const line = lo - 1;
    return { line, column: offset - this._lineStarts[line] };
  }

  lineColumnToOffset(line, column) {
    line = Math.max(0, Math.min(line, this._lineStarts.length - 1));
    const ls = this._lineStarts[line];
    const ll = this.getLineLength(line);
    column = Math.max(0, Math.min(column, ll));
    return ls + column;
  }

  getLineStart(line) {
    if (line < 0) return 0;
    if (line >= this._lineStarts.length) return this.getTotalLength();
    return this._lineStarts[line];
  }

  getLineEnd(line) {
    if (line + 1 < this._lineStarts.length) return this._lineStarts[line + 1];
    return this.getTotalLength();
  }

  getVersion() { return this._version; }

  /** Serialize the *content* (not structure) for persistence. */
  serialize() { return this.getText(); }

  /** Build a fresh buffer from serialized text. */
  static deserialize(text) { return new PieceTableBuffer(text); }
}

export { PieceTableBuffer };

/* ===== commands.js ===== */
/* ============================================================
   commands.js — the Command pattern.

   WHY COMMAND, NOT MEMENTO/STATE-SNAPSHOTS
   -----------------------------------------
   A Memento design would snapshot the entire document state after
   every edit. For a 1 MB document that's ~1 MB per history entry,
   so 500 entries ≈ 500 MB of sealed strings the GC must copy.
   A Command stores only the *diff*: an insert keeps {offset,
   text, piece-state before/after}. Undo replays the reverse
   piece-state with O(pieces) cost and zero text copying (see
   buffer.js). Memory is bounded by edit count, not document size.

   CURSOR SNAPSHOTTING:
   Commands snapshot the cursor BEFORE they are applied (if not
   provided), so undo/redo can restore caret positions exactly.
   After applying, they move the caret to the natural post-edit
   position (insert → after the inserted text, delete → at the
   deletion point). This keeps every command self-contained —
   callers never have to know where the caret should land.
   ============================================================ */

function snapCursor(doc) {
  return { line: doc.cursor.line, column: doc.cursor.column };
}

export class InsertTextCommand {
  constructor(offset, text, opts = {}) {
    this.type = 'insert';
    this.offset = offset;
    this.text = text;
    this.cursorBefore = opts.cursorBefore || null;
    this.desc = null;
  }

  execute(doc) {
    const buf = doc.buffer;
    if (this.cursorBefore == null) this.cursorBefore = snapCursor(doc);
    if (!this.desc) this.desc = buf.insert(this.offset, this.text);
    else buf.redo(this.desc);
    const pos = buf.offsetToLineColumn(this.offset + this.text.length);
    doc.cursor.setPosition(pos.line, pos.column, { resetGoal: true });
    doc.setSelection(null);
  }

  undo(doc) {
    if (this.desc) buf(doc).undo(this.desc);
    _restore(doc, this.cursorBefore, this.offset);
  }

  redo(doc) { this.execute(doc); }
}

export class DeleteTextCommand {
  constructor(offset, text, opts = {}) {
    this.type = 'delete';
    this.offset = offset;
    this.text = text;
    this.cursorBefore = opts.cursorBefore || null;
    this.desc = null;
    this.capturedText = null;
  }

  execute(doc) {
    const buf = doc.buffer;
    if (this.cursorBefore == null) this.cursorBefore = snapCursor(doc);
    if (this.capturedText == null) this.capturedText = buf.getText(this.offset, this.text.length);
    if (!this.desc) this.desc = buf.delete(this.offset, this.capturedText.length);
    else buf.redo(this.desc);
    const pos = buf.offsetToLineColumn(this.offset);
    doc.cursor.setPosition(pos.line, pos.column, { resetGoal: true });
    doc.setSelection(null);
  }

  undo(doc) {
    if (this.desc) buf(doc).undo(this.desc);
    _restore(doc, this.cursorBefore, this.offset);
  }

  redo(doc) { this.execute(doc); }
}

export class ReplaceSelectionCommand {
  constructor(range, replacement, opts = {}) {
    this.type = 'replace';
    this.range = range;
    this.replacement = replacement;
    this.cursorBefore = opts.cursorBefore || null;
    this.deleted = null;
    this.delDesc = null;
    this.insDesc = null;
  }

  execute(doc) {
    const buf = doc.buffer;
    if (this.cursorBefore == null) this.cursorBefore = snapCursor(doc);
    const { start, end } = this.range;
    if (this.deleted == null) this.deleted = buf.getText(start, end - start);
    if (end > start) {
      if (!this.delDesc) this.delDesc = buf.delete(start, end - start);
      else buf.redo(this.delDesc);
    }
    if (this.replacement.length > 0) {
      if (!this.insDesc) this.insDesc = buf.insert(start, this.replacement);
      else buf.redo(this.insDesc);
    }
    const pos = buf.offsetToLineColumn(start + this.replacement.length);
    doc.cursor.setPosition(pos.line, pos.column, { resetGoal: true });
    doc.setSelection(null);
  }

  undo(doc) {
    // Un-apply in the reverse order of execute(): remove the
    // replacement first, then bring back the deleted text.
    if (this.replacement.length > 0 && this.insDesc) buf(doc).undo(this.insDesc);
    if (this.range.end > this.range.start && this.delDesc) buf(doc).undo(this.delDesc);
    _restore(doc, this.cursorBefore, this.range.start);
  }

  redo(doc) { this.execute(doc); }
}

/** Groups several commands as ONE undo step. */
export class CompositeCommand {
  constructor(children = []) {
    this.type = 'composite';
    this.children = children;
    this.label = '';
  }

  get isEmpty() { return this.children.length === 0; }

  add(cmd) { this.children.push(cmd); }

  execute(doc) { for (const c of this.children) c.execute(doc); }
  undo(doc) { for (let i = this.children.length - 1; i >= 0; i--) this.children[i].undo(doc); }
  redo(doc) { for (const c of this.children) c.redo(doc); }

  get last() { return this.children[this.children.length - 1]; }
  get cursorBefore() {
    return this._cursorBefore ?? (this.children.length ? this.children[0].cursorBefore : null);
  }
  set cursorBefore(v) { this._cursorBefore = v; }
  get cursorAfter() {
    return this._cursorAfter ?? (this.children.length ? this.children[this.children.length - 1].cursorAfter : null);
  }
  set cursorAfter(v) { this._cursorAfter = v; }
}

function buf(doc) { return doc.buffer; }

function _restore(doc, cursorBefore, fallbackOffset) {
  if (cursorBefore) {
    doc.cursor.setPosition(cursorBefore.line, cursorBefore.column, { resetGoal: true });
  } else {
    const pos = doc.buffer.offsetToLineColumn(fallbackOffset);
    doc.cursor.setPosition(pos.line, pos.column, { resetGoal: true });
  }
  doc.setSelection(null);
}

/* ===== cursor.js ===== */
/* ============================================================
   cursor.js — cursor position model.

   The cursor is a *logical* {line, column} position (0-based),
   backed by the buffer's line index. It is NOT a DOM caret — the
   renderer draws a custom blinking div. The "goal column" sticky
   behavior for Up/Down navigation lives here.

   GOAL-COLUMN ("sticky column") BEHAVIOR
   ---------------------------------------
   Most naive editors treat Up/Down as "move to the same character
   column on the adjacent line". That breaks when lines have
   varying lengths: going down from column 20 on a 50-char line to
   a 5-char line lands on column 5, then going further down to a
   40-char line must SNAP BACK toward column 20. If you only store
   the *current* column, by the time you've passed the short line
   your "column" is 5 and you'll drift left forever.

   Fix: keep a separate `goalColumn` that is:
     - set fresh whenever the user moves *horizontally* (Left/Right,
       click, Home/End, typing, word-jump) — this resets the anchor,
     - PRESERVED across consecutive vertical moves. Each vertical
       move clamps the actual caret to min(goalColumn, lineLength),
       and if the line is long again the caret "snaps back" to the
       original goalColumn.

   We ALSO track goalX in pixels. For variable-width fonts the
   purely character-based goal is often wrong (10 'i' chars ≠ 10
   'م' chars), so when Word Wrap / rendering is aware we prefer the
   pixel-based goal. We store both: `goalColumn` (chars) and
   `goalX` (CSS pixels, set by renderer-aware code). If goalX is
   set we use it to pick the nearest character on the target row;
   otherwise we fall back to character columns.

   Manual test case (see README):
     1. Type 40 chars on line 1, 3 chars on line 2, 40 on line 3.
     2. Put cursor near column 25 on line 1.
     3. Press Down → caret on line 2 col 3.  Press Down → caret on
        line 3 ≈ col 25 (snaps BACK, not stuck at 3).
   ============================================================ */



export class Cursor {
  constructor(line = 0, column = 0) {
    this.line = line;
    this.column = column;
    this.goalColumn = column;   // sticky column (characters)
    this.goalX = null;          // sticky column (pixels), when known
    this.affinity = 'down';     // caret affinity for wrapped rows
  }

  clone() {
    const c = new Cursor(this.line, this.column);
    c.goalColumn = this.goalColumn;
    c.goalX = this.goalX;
    c.affinity = this.affinity;
    return c;
  }

  /** Set an absolute position; horizontal moves reset the goal. */
  setPosition(line, column, opts = {}) {
    this.line = line;
    this.column = column;
    this.affinity = opts.affinity || 'down';
    if (opts.resetGoal) {
      this.goalColumn = column;
      this.goalX = null;
    }
  }

  equals(other) {
    return !!other && other.line === this.line && other.column === this.column;
  }

  /** True if `p` is strictly before this position. */
  isBefore(other) {
    return other.line > this.line ||
           (other.line === this.line && other.column > this.column);
  }

  serialize() { return { line: this.line, column: this.column }; }

  static deserialize(o) {
    return new Cursor(o.line || 0, o.column || 0);
  }

  /** Clamp a position onto a line length. */
  static clampCol(lineLen, col) { return clamp(col, 0, lineLen); }
}

/* ===== selection.js ===== */
/* ============================================================
   selection.js — selection model, stored as *offsets*.
   Offsets (UTF-16 code units) are the single source of truth
   because they survive buffer edits trivially and map cleanly to
   line/column via the buffer. The renderer converts offsets to
   visual rows when drawing highlight rectangles.
   ============================================================ */

export class Selection {
  /** @param {number} anchor offset (fixed point)
      @param {number} head  offset (moving point) */
  constructor(anchor, head = anchor) {
    this.anchor = anchor;
    this.head = head;
    this.active = true;
  }

  get isEmpty() { return this.anchor === this.head; }

  /** start/end — normalized order for range ops. */
  get start() { return Math.min(this.anchor, this.head); }
  get end() { return Math.max(this.anchor, this.head); }

  /** Extend the head to a new offset; anchor stays put. */
  extend(offset, opts = {}) {
    if (!this.active && !opts.force) return;
    this.head = offset;
    this.active = true;
  }

  collapse() { this.head = this.anchor; }

  setAll(anchor, head = anchor) {
    this.anchor = anchor;
    this.head = head;
    this.active = true;
  }

  isForward() { return this.head >= this.anchor; }

  clone() {
    const s = new Selection(this.anchor, this.head);
    s.active = this.active;
    return s;
  }

  isEmptyFor(buffer) { return this.isEmpty; }

  serialize() { return { anchor: this.anchor, head: this.head }; }

  static deserialize(o) {
    return new Selection(o.anchor, o.head);
  }
}

/* ===== persistence.js ===== */
/* ============================================================
   persistence.js — indexDB-backed storage + localStorage.

   WHY TWO STORES (and why IndexedDB is primary)
   ---------------------------------------------
   localStorage is synchronous (blocks the main thread), capped at
   ~5 MB, and only stores strings. For small settings it's ideal:
   the whole read costs microseconds.

   IndexedDB is asynchronous and capacity-based (typically hundreds
   of MB), which is what we want for DOCUMENT CONTENT, per-document
   state and version snapshots — writes are fire-and-forget so they
   never jank typing.

   Engineering rule we follow:
   - Settings/preferences (theme, lang, font, AI provider config,
     editor options): localStorage. Tiny, synchronous, always
     available immediately at boot.
   - Documents (content + cursor + scroll + undo-ish flags) and
     version history: IndexedDB. Larger, async, debounced writes.
   - Session state (open tab order, active doc, AI panel state):
     IndexedDB record with a localStorage mirror for a fast boot
     hint.

   DATA SAFETY
   -----------
   autosave(): debounced (app layer), plus immediate flush on
   visibilitychange / pagehide / beforeunload. If a write fails with
   QuotaExceededError we surface a warning toast and prune oldest
   version snapshots before giving up.

   NOTE: this module exposes primitives; documents.js/app.js decide
   WHEN to persist and WHAT a document record looks like.
   ============================================================ */

const DB_NAME = 'te-editor';
const DB_VERSION = 1;
const LS_PREFIX = 'te.';

export class Storage {
  constructor() {
    this._db = null;
    this._ready = null;
    this.available = false;        // set true once IndexedDB opens
    this._sw = typeof navigator !== 'undefined' && 'serviceWorker' in navigator;
    this.listener = null;      // set by app to update the save indicator
    this.quotaExceeded = false;
  }

  /* ---------------- LocalStorage helpers ---------------- */

  lsGet(key, def = null) {
    try {
      const v = localStorage.getItem(LS_PREFIX + key);
      return v === null ? def : JSON.parse(v);
    } catch { return def; }
  }

  lsSet(key, val) {
    try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); }
    catch (e) {
      if (e && e.name === 'QuotaExceededError') this._onQuota();
    }
  }

  lsDel(key) { try { localStorage.removeItem(LS_PREFIX + key); } catch {} }

  /* ---------------- IndexedDB ---------------- */

  open() {
    if (this._ready) return this._ready;
    if (!('indexedDB' in window)) {
      this._ready = Promise.reject(new Error('IndexedDB not available'));
      return this._ready;
    }
    // If IndexedDB never fires (some headless/private contexts), don't
    // hang the whole editor forever — fail fast into memory mode.
    const timeout = new Promise((_, reject) => setTimeout(() => {
      if (!this.available) reject(new Error('IndexedDB open timed out'));
    }, 2500));
    let resolve_, reject_;
    this._ready = new Promise((resolve, reject) => { resolve_ = resolve; reject_ = reject; });
    const openReq = indexedDB.open(DB_NAME, DB_VERSION);
    openReq.onupgradeneeded = (e) => {
      const db = openReq.result;
      if (!db.objectStoreNames.contains('docs')) {
        db.createObjectStore('docs', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('versions')) {
        const vs = db.createObjectStore('versions', { keyPath: 'id', autoIncrement: true });
        vs.createIndex('docId', 'docId', { unique: false });
        vs.createIndex('ts', 'ts', { unique: false });
      }
      if (!db.objectStoreNames.contains('session')) {
        db.createObjectStore('session', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('recents')) {
        db.createObjectStore('recents', { keyPath: 'id' });
      }
    };
    openReq.onsuccess = () => {
      this._db = openReq.result;
      this._db.onerror = () => {};
      this.available = true;
      resolve_(this._db);
    };
    openReq.onerror = () => reject_(openReq.error);
    openReq.onblocked = () => reject_(new Error('IndexedDB blocked'));
    this._ready = Promise.race([this._ready, timeout]);
    return this._ready;
  }

  async _tx(name, mode, fn) {
    if (!this.available) throw new Error('storage unavailable');
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, mode);
      const store = tx.objectStore(name);
      const out = fn(store);
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }

  /* ---------------- Document records ---------------- */

  async saveDoc(rec) {
    try {
      const out = await this._tx('docs', 'readwrite', (s) => s.put(rec));
      if (this.listener) this.listener('saved');
      return out;
    } catch (e) {
      if (this._isQuota(e)) {
        this._onQuota();
        await this._pruneOldVersions(rec.id, 10);
        throw e;
      }
      throw e;
    }
  }

  async loadAllDocs() {
    if (!this.available) return [];
    try {
      const db = await this.open();
      return new Promise((resolve) => {
        const tx = db.transaction('docs', 'readonly');
        const req = tx.objectStore('docs').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    } catch { return []; }
  }

  async deleteDoc(id) {
    await this._tx('docs', 'readwrite', (s) => s.delete(id));
    await this._tx('versions', 'readwrite', (s) => {
      const idx = s.index('docId');
      const req = idx.getAllKeys(IDBKeyRange.only(id));
      req.onsuccess = () => req.result.forEach(k => s.delete(k));
    });
  }

  /* ---------------- Settings (indexedDB copy) ---------------- */

  async saveI(key, val) {
    await this._tx('settings', 'readwrite', (s) => s.put({ key, val }));
  }
  async getI(key) {
    const out = await this._tx('settings', 'readonly', (s) => s.get(key));
    return out ? out.val : undefined;
  }

  /* ---------------- Session ---------------- */

  async saveSession(sess) {
    await this._tx('session', 'readwrite', (s) => s.put({ id: 'main', ...sess, ts: Date.now() }));
    // mirror a tiny part in localStorage for instant boot decisions
