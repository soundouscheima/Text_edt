    this.lsSet('sessionHint', { activeDocId: sess.activeDocId, tabs: sess.tabs, hasSession: true });
  }

  async loadSession() {
    if (!this.available) return null;
    try {
      const out = await this._tx('session', 'readonly', (s) => s.get('main'));
      return out || null;
    } catch { return null; }
  }

  /* ---------------- Version snapshots ---------------- */

  async saveVersion(docId, text, meta = {}) {
    try {
      await this._tx('versions', 'readwrite', (s) => s.put({
        docId, ts: Date.now(), text, title: meta.title, excerpt: meta.excerpt || text.slice(0, 120),
      }));
      return true;
    } catch (e) {
      if (this._isQuota(e)) {
        await this._pruneOldVersions(docId, 20);
        try { await this._tx('versions', 'readwrite', (s) => s.put({ docId, ts: Date.now(), text })); } catch {}
      }
      return false;
    }
  }

  async loadVersions(docId) {
    if (!this.available) return [];
    try {
      const db = await this.open();
      return new Promise((resolve) => {
        const tx = db.transaction('versions', 'readonly');
        const idx = tx.objectStore('versions').index('docId');
        const req = idx.getAll(IDBKeyRange.only(docId));
        req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.ts - a.ts));
        req.onerror = () => resolve([]);
      });
    } catch { return []; }
  }

  async _pruneOldVersions(docId, keep) {
    const rows = await this.loadVersions(docId);
    for (let i = keep; i < rows.length; i++) {
      await this._tx('versions', 'readwrite', (s) => s.delete(rows[i].id));
    }
  }

  /* ---------------- Recents ---------------- */

  async saveRecent(rec) {
    await this._tx('recents', 'readwrite', (s) => s.put({ id: rec.id, name: rec.name, ts: rec.ts }));
  }
  async loadRecents() {
    if (!this.available) return [];
    try {
      const out = await this._tx('recents', 'readonly', (s) => s.getAll());
      return (out || []).sort((a, b) => b.ts - a.ts);
    } catch { return []; }
  }
  async clearRecents() {
    await this._tx('recents', 'readwrite', (s) => s.clear());
  }

  /* ---------------- Error handling ---------------- */

  _isQuota(e) {
    return e && (e.name === 'QuotaExceededError' || e.code === 22 || e.name === 'NS_ERROR_DOM_QUOTA_REACHED');
  }

  _onQuota() {
    this.quotaExceeded = true;
    if (this.listener) this.listener('error');
  }

  /** Estimate total storage used (best-effort, async). */
  async estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        return await navigator.storage.estimate();
      }
    } catch {}
    return null;
  }
}

export const storage = new Storage();

/* ===== history.js ===== */
/* ============================================================
   history.js — Undo/Redo manager built on the Command pattern.

   WHY COMMAND PATTERN OVER MEMENTO
   --------------------------------
   A Memento design would snapshot the entire document state after
   every edit. For a 1 MB document that's ~1 MB per history entry,
   so 500 entries ≈ 500 MB of sealed strings the GC must copy.
   Instead every history entry is a COMMAND object holding the
   *diff* of the edit (an insert stores {offset, text, piece-state
   before/after}). Undoing replays the reverse piece-state in O(p)
   with zero text copying (see buffer.js). This is the pattern used
   by real editors and keeps memory bounded by edit count, not doc
   size.

   STACKS
   ------
   undoStack: commands that have been APPLIED, oldest→newest.
   redoStack: commands that have been UN-APPLIED (cancelled).
   - push(cmd)           applies a command (or appends to the open
                         typing group) and clears the redo stack.
   - undo()              pops undoStack, un-applies, pushes redoStack,
                         restores pre-command cursor.
   - redo()              pops redoStack, re-applies, pushes undoStack,
                         restores post-command cursor.

   GROUPED TYPING
   --------------
   Typing "hello" must feel like ONE undo step. input.js opens a
   group via beginGroup(), applies each keystroke immediately for
   responsive rendering, and records the command into the working
   CompositeCommand. endGroup() seals the composite into the undo
   stack. An explicit action (backspace, paste, AI insert, cursor
   move) commits the open group first.

   CAP: to bound memory we keep no more than HISTORY_LIMIT entries,
   trimming the oldest. (The piece table keeps each entry tiny, but
   a pathological paste-heavy session could still grow.)

   Persisting undo history across reload:
   --------------------------------------
   Deliberately NOT implemented. Command offsets are absolute and
   would silently corrupt the document if the restored text differs
   from the text the commands were recorded against. Doing it
   safely requires versioned snapshots (linking each command to the
   exact serialized buffer state) which multiplies storage cost
   for almost no real benefit — real-world undo rarely needs to
   survive a browser restart. We DO persist document content,
   cursor, scroll and tabs (see persistence.js) which is the
   reliable 98% case.
   ============================================================ */



export class HistoryManager {
  constructor(doc, opts = {}) {
    this.doc = doc;
    this.limit = opts.limit || 1000;
    this.undoStack = [];
    this.redoStack = [];
    this.openGroup = null;
    this._cursorBeforeGroup = null;
    this.onChange = opts.onChange || (() => {});
  }

  /** Open (or reuse) a typing group. */
  beginGroup(label = '') {
    if (!this.openGroup) {
      this.openGroup = new CompositeCommand();
      this.openGroup.label = label;
      this._cursorBeforeGroup = this._snapshotCursor();
    } else if (label && !this.openGroup.label) {
      this.openGroup.label = label;
    }
    return this.openGroup;
  }

  get isGroupOpen() { return !!this.openGroup; }

  /** Commit the open group into the undo stack (no-op if empty). */
  endGroup() {
    if (!this.openGroup) return false;
    const group = this.openGroup;
    this.openGroup = null;
    const before = this._cursorBeforeGroup;
    this._cursorBeforeGroup = null;
    if (group.isEmpty) return false;
    group.cursorBefore = before || this._snapshotCursor();
    group.cursorAfter = this._snapshotCursor();
    // Seal: the group's children have already been applied live.
    this.undoStack.push(group);
    this.redoStack.length = 0;
    this._trim();
    this.onChange();
    return true;
  }

  /** Add a command: if a group is open, add it (do NOT execute —
      the group as a whole was applied live); otherwise execute and
      record. */
  add(cmd) {
    if (cmd.type === 'noop' || cmd.isEmpty) return;
    if (this.openGroup) {
      this.openGroup.add(cmd);
      return cmd;
    }
    cmd.execute(this.doc);
    this.undoStack.push(cmd);
    this.redoStack.length = 0;
    this._trim();
    this.onChange();
    return cmd;
  }

  /** Undo one step (or a whole group). Returns true if applied. */
  undo() {
    this.endGroup();
    const cmd = this.undoStack.pop();
    if (!cmd) return false;
    cmd.undo(this.doc);
    this.redoStack.push(cmd);
    this._restoreCursor(cmd.cursorBefore);
    this.onChange();
    return true;
  }

  /** Redo one step. Returns true if applied. */
  redo() {
    const cmd = this.redoStack.pop();
    if (!cmd) return false;
    cmd.redo(this.doc);
    this.undoStack.push(cmd);
    this._restoreCursor(cmd.cursorAfter);
    this.onChange();
    return true;
  }

  canUndo() { return this.undoStack.length > 0 || (this.openGroup && !this.openGroup.isEmpty); }
  canRedo() { return this.redoStack.length > 0; }

  _snapshotCursor() {
    const c = this.doc.cursor;
    return { line: c.line, column: c.column };
  }

  _restoreCursor(pos) {
    if (!pos) { this.doc.setSelection(null); return; }
    this.doc.cursor.setPosition(pos.line, pos.column, { resetGoal: true });
    this.doc.setSelection(null);
  }

  _trim() {
    while (this.undoStack.length > this.limit) this.undoStack.shift();
  }

  clear() {
    this.endGroup();
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.onChange();
  }

  serializeSummary() { return { undo: this.undoStack.length, redo: this.redoStack.length }; }
}

/* ===== renderer.js ===== */
/* ============================================================
   renderer.js — turns buffer + cursor + selection into DOM.

   TWO COORDINATE SYSTEMS (the crux)
   ----------------------------------
   LOGICAL model: the buffer's real lines, split only on '\n'.
   Cursor/edit operations live here.
   VISUAL model: computed at render time. A long logical line is
   broken into VISUAL ROWS based on the measured pixel width of
   the container and the actual (variable-width) glyph widths.

   Because a row's row-count depends ONLY on its own line's text
   and the wrap width (never on neighbors), we can maintain exact
   global geometry cheaply:
     rowCounts[line] → number of visual rows for that logical line
     prefix[line]    → count of rows before that line
   Every edit only invalidates the edited line's count; the prefix
   sum is rebuilt in one O(lines) pass (tiny constant, invisible at
   even 50k lines) OR updated on cache hits.

   ROW COORDINATE CONVENTION
   -------------------------
   All row-internal X values are measured from the LEFT edge of the
   row's visible text box in DISPLAY space, regardless of direction.
   - LTR: caret before col k sits at x = Σ width(glyphs<k).
   - RTL: glyphs flow right→left, so caret before col k sits at
          x = rowWidth − Σ width(glyphs<k), i.e. the boundary
          positions are [rowWidth, rowWidth−w0, …]. This is exactly
          the mirror of LTR and gives correct caret/click mapping
          for pure-Arabic and Arabic+numbers rows.
   The row's text box itself is right-aligned in wrap mode (text
   hugs the right edge), so we offset by (wrapWidth − rowWidth)
   when the row is RTL and wrapped.

   BIDI MIXED LINES: rendering is perfect (the browser shapes and
   orders runs). Cursor/hit-test math uses the linear advance model
   above; for truly interleaved-script lines this is an
   approximation (documented tradeoff).

   WORD WRAP
   ---------
   - Never splits a grapheme (Intl.Segmenter).
   - Breaks at the last whitespace that fit; hard-breaks mid-word
     only if a single word exceeds the row width (covers Arabic).
   - A whitespace used as a break point is elided from display but
     stays in the logical text.

   VIRTUALIZATION
   --------------
   Only rows intersecting the viewport (± slack) are materialized
   as pooled absolutely-positioned divs. Y positions are in
   document space; viewport scrolling moves them naturally, so
   scrolling never reparses text.
   ============================================================ */



const PAD = 8;
const VSLACK = 2;

export class Renderer {
  constructor(els) {
    this.viewport = els.viewport;
    this.linesEl = els.lines;
    this.gutterEl = els.gutter;
    this.selectionLayer = els.selectionLayer;
    this.caretEl = els.caretEl;

    this.buffer = null;
    this.opts = {
      fontSize: 16,
      fontFamily: "Consolas, 'Courier New', monospace",
      wrap: true,
      lineHeight: 1.5,
      showLineNumbers: true,
      docDir: 'ltr',
    };

    this._measure = document.createElement('canvas').getContext('2d');

    this.rowCache = new Map();     // lineIndex → VisualRow[]
    this._mx = 400;
    this.rowCounts = [];
    this.prefix = [0];

    this.matches = [];
    this.activeMatch = 0;

    this.rowHeight = 20;
    this.wrapWidth = 0;
    this.maxLineWidth = 0;
    this.scrollTop = 0;
    this.scrollLeft = 0;
    this.viewportW = 0;
    this.viewportH = 0;
    this.domPool = [];
    this.selPool = [];
    this.matchPool = [];
    this.curLineBgs = [];
    this.gutterPool = [];

    this._visibleCache = [];
    this._sel = null;
    this._lastCursor = null;
    this._savedCaretVisible = false;

    this._bindResizeObserver();
  }

  /* ------------------------------------------------ */
  /* Setup                                            */
  /* ------------------------------------------------ */

  setBuffer(buffer) {
    this.buffer = buffer;
    this.rowCache.clear();
    this._rebuildRowCounts();
    this.matches = [];
    this.render();
  }

  setOptions(patch) {
    Object.assign(this.opts, patch);
    this._applyFont();
    this.rowCache.clear();
    this._rebuildRowCounts();
    this.render();
  }

  _applyFont() {
    const q = `"${this.opts.fontFamily}"`;
    this.linesEl.style.fontFamily = q;
    this.linesEl.style.fontSize = this.opts.fontSize + 'px';
    this.linesEl.style.lineHeight = String(this.opts.lineHeight);
    this._measure.font = `${this.opts.fontSize}px ${q}`;
    this._measure.fontKerning = 'normal';
    // real rendered line height
    const probe = document.createElement('div');
    probe.className = 'vline';
    probe.textContent = 'Hgم';
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.whiteSpace = 'pre';
    probe.style.fontFamily = q;
    probe.style.fontSize = this.opts.fontSize + 'px';
    probe.style.lineHeight = String(this.opts.lineHeight);
    document.body.appendChild(probe);
    const lh = probe.getBoundingClientRect().height;
    probe.remove();
    this.rowHeight = lh > 0 ? lh : this.opts.fontSize * this.opts.lineHeight;
  }

  _bindResizeObserver() {
    const ro = new ResizeObserver(() => {
      const w = this.viewport.clientWidth;
      const h = this.viewport.clientHeight;
      if (w === this.viewportW && h === this.viewportH) return;
      this.viewportW = w;
      this.viewportH = h;
      this.wrapWidth = Math.max(50, w - PAD * 2);
      this.rowCache.clear();
      this._rebuildRowCounts();
      this.render();
    });
    ro.observe(this.viewport);
    this.viewport.addEventListener('scroll', () => {
      const st = this.viewport.scrollTop;
      const sl = this.viewport.scrollLeft;
      if (st === this.scrollTop && sl === this.scrollLeft) return;
      this.scrollTop = st;
      this.scrollLeft = sl;
      this._paint();
    }, { passive: true });
  }

  /* ------------------------------------------------ */
  /* Geometry bookkeeping                             */
  /* ------------------------------------------------ */

  _rebuildRowCounts() {
    if (!this.buffer) return;
    const L = this.buffer.getLineCount();
    this.rowCounts = new Array(L);
    this.prefix = new Array(L + 1);
    let acc = 0;
    for (let i = 0; i < L; i++) {
      const cached = this.rowCache.get(i);
      const n = cached ? cached.length : 1;
      this.rowCounts[i] = n;
      this.prefix[i] = acc;
      acc += n;
    }
    this.prefix[L] = acc;
    this._updateDocHeight();
  }

  _rebuildPrefix() {
    if (!this.buffer) return;
    const L = this.buffer.getLineCount();
    if (this.rowCounts.length !== L) this.rowCounts = this.rowCounts.slice(0, L);
    this.prefix = new Array(L + 1);
    let acc = 0;
    for (let i = 0; i < L; i++) {
      this.prefix[i] = acc;
      acc += this.rowCounts[i] || 1;
    }
    this.prefix[L] = acc;
    this._updateDocHeight();
  }

  _updateDocHeight() {
    if (!this.buffer) return;
    const total = this.prefix[this.prefix.length - 1] || 0;
    const H = (total * this.rowHeight) + 'px';
    this.linesEl.style.height = H;
    this.selectionLayer.style.height = H;
    const contentW = this.opts.wrap
      ? Math.max(this.wrapWidth + PAD * 2, this.viewportW || 100)
      : Math.max(this.maxLineWidth + PAD * 2, this.viewportW || 100);
    this.linesEl.style.width = contentW + 'px';
  }

  invalidateFromLine(lineIdx) {
    if (!this.buffer) return;
    const L = this.buffer.getLineCount();
    this.rowCache.delete(lineIdx);
    if (this.rowCounts.length !== L) {
      for (let i = lineIdx; i <= L; i++) this.rowCache.delete(i);
      this._rebuildRowCounts();
    } else {
      const cached = this.rowCache.get(lineIdx);
      this.rowCounts[lineIdx] = cached ? cached.length : 1;
      this._rebuildPrefix();
    }
  }

  /* ------------------------------------------------ */
  /* Measurement & layout                             */
  /* ------------------------------------------------ */

  _measureWidth(text) {
    return text === '\t' ? this._measure.measureText('    ').width : this._measure.measureText(text).width;
  }

  /** Grapheme widths for a line/row string. */
  _lineChars(text) {
    const chars = [];
    if (!text) return chars;
    let i = 0;
    const n = text.length;
    while (i < n) {
      const e = nextGrapheme(text, i);
      const seg = text.slice(i, e);
      chars.push({ s: i, e, w: this._measureWidth(seg) });
      i = e;
    }
    return chars;
  }

  /** Build visual rows for one logical line. */
  _layoutLine(lineIdx) {
    const text = this.buffer.getLine(lineIdx);
    const chars = this._lineChars(text);
    const maxW = this.opts.wrap ? this.wrapWidth : Infinity;
    const rows = [];

    if (chars.length === 0) {
      rows.push(this._mkRow(lineIdx, 0, 0, '', false, 0));
      return rows;
    }

    let start = 0;          // char-index where the current row starts
    let w = 0;              // accumulated width from `start`
    let lastSpace = null;   // {idx, wBefore}
    const splitRow = (endCharIdx, usedW, nextStart) => {
      const startCol = chars[start].s;
      const endCol = endCharIdx > 0 ? chars[endCharIdx - 1].e : startCol;
      const nextCol = nextStart < chars.length ? chars[nextStart].s : text.length;
      const rowText = (nextCol > endCol) ? text.slice(startCol, endCol) : text.slice(startCol, endCol);
      rows.push(this._mkRow(lineIdx, startCol, endCol, rowText, start > 0, usedW));
    };

    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const isSpace = c.e <= c.s ? false : /\s/u.test(text.slice(c.s, c.e));
      if (w + c.w > maxW && w > 0) {
        if (lastSpace && lastSpace.idx >= start) {
          // break after the last whitespace that fit
          const breakIdx = lastSpace.idx;
          splitRow(breakIdx, lastSpace.wBefore, breakIdx + 1);
          start = breakIdx + 1;
          w = 0;
          lastSpace = null;
          i = start - 1; // re-scan from new start (chars were not all consumed)
          continue;
        }
        // hard break (single word wider than the row)
        splitRow(i, w, i);
        start = i;
        w = 0;
        lastSpace = null;
        i = start - 1;
        continue;
      }
      w += c.w;
      if (isSpace) { lastSpace = { idx: i, wBefore: w - c.w }; }
    }

    if (start < chars.length) {
      splitRow(chars.length, w, chars.length);
    } else if (rows.length === 0) {
      rows.push(this._mkRow(lineIdx, text.length, text.length, '', true, 0));
    }
    return rows;
  }

  _mkRow(line, startCol, endCol, text, isContinuation, width) {
    const dir = detectLineDirection(text) === 'rtl' ? 'rtl' : 'ltr';
    return {
      line, startCol, endCol, text,
      isContinuation, width,
      dir, localRow: null, chars: null,
    };
  }

  /* ------------------------------------------------ */
  /* Row lookup                                       */
  /* ------------------------------------------------ */

  _rowsForLine(lineIdx) {
    if (!this.buffer || lineIdx < 0 || lineIdx >= this.buffer.getLineCount()) return [];
    let rows = this.rowCache.get(lineIdx);
    if (!rows) {
      rows = this._layoutLine(lineIdx);
      for (const r of rows) r.chars = this._lineChars(r.text);
      this.rowCache.set(lineIdx, rows);
      if (this.rowCache.size > this._mx) {
        const keys = [...this.rowCache.keys()].slice(0, this._mx >> 1);
        for (const k of keys) this.rowCache.delete(k);
      }
      if (this.rowCounts[lineIdx] !== rows.length) {
        this.rowCounts[lineIdx] = rows.length;
        this._rebuildPrefix();
      }
      if (!this.opts.wrap) {
        let rw = 0;
        for (const r of rows) rw = Math.max(rw, r.width);
        if (rw > this.maxLineWidth) { this.maxLineWidth = rw; this._updateDocHeight(); }
      }
    }
    return rows;
  }

  _globalRowOfRow(row) {
    let local = row.localRow;
    if (local == null) {
      const rows = this._rowsForLine(row.line);
      local = rows.indexOf(row);
      row.localRow = local;
    }
    return this.prefix[row.line] + local;
  }

  _locateRow(globalRow) {
    if (!this.buffer) return { line: null, local: 0 };
    const P = this.prefix;
    let lo = 0, hi = P.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (P[mid] <= globalRow) lo = mid;
      else hi = mid - 1;
    }
    return { line: lo, local: globalRow - P[lo] };
  }

  /** The visual row structure containing a buffer offset. */
  visualRowOfOffset(offset) {
    if (!this.buffer) return null;
    const { line, column } = this.buffer.offsetToLineColumn(offset);
    const rows = this._rowsForLine(line);
    let row = null;
    for (const r of rows) {
      if (column >= r.startCol && column <= r.endCol) { row = r; break; }
      if (column < r.startCol) { row = r; break; }
    }
    if (!row && rows.length) row = rows[rows.length - 1];
    if (!row) return { line, localRow: 0, row: null };
    const localRow = rows.indexOf(row);
    row.localRow = localRow;
    return { line, localRow, globalRow: this.prefix[line] + localRow, row };
  }

  /* ------------------------------------------------ */
  /* Row-local X math (display space, from left)       */
  /* ------------------------------------------------ */

  _rowWidth(row) {
    if (row.chars) {
      let w = 0;
      for (const c of row.chars) w += c.w;
      return w;
    }
    return row.width;
  }

  /** Sum of glyph widths strictly to the left of logical `col`
      within this row (display-space, direction-agnostic). */
  _advanceWidth(row, col) {
    let w = 0;
    for (const c of row.chars) {
      if (col <= c.s) break;
      w += c.w; // partial grapheme still counts its full advance
    }
    return w;
  }

  /** doc-space X (px from the container's left, ignoring scroll)
      of the caret boundary at logical column `col` in `row`. */
  docXOfColumn(row, col) {
    col = clamp(col, row.startCol, row.endCol);
    const rw = this._rowWidth(row);
    const fromLeft = row.dir === 'rtl' ? rw - this._advanceWidth(row, col) : this._advanceWidth(row, col);
    const textLeft = (this.opts.wrap && row.dir === 'rtl') ? this.wrapWidth - rw : 0;
    return textLeft + fromLeft;
  }

  /** Nearest logical column to an X within the row's text box.
      Threatens by nearest boundary position. */
  colAtX(row, xInText) {
    const chars = row.chars;
    const rw = this._rowWidth(row);
    const bounds = [];
    if (row.dir === 'rtl') {
      let b = rw;
      bounds.push(b);
      for (const c of chars) { b -= c.w; bounds.push(b); }
    } else {
      let b = 0;
      bounds.push(b);
      for (const c of chars) { b += c.w; bounds.push(b); }
    }
    // nearest boundary (glyph-box edges are the caret positions)
    let best = 0, bestD = Infinity;
    for (let k = 0; k < bounds.length; k++) {
      const d = Math.abs(xInText - bounds[k]);
      if (d < bestD) { bestD = d; best = k; }
    }
    if (best >= chars.length) return row.endCol;
    return row.startCol + chars[best].s; // boundary k sits before char k
  }

  /* ------------------------------------------------ */
  /* Rendering                                        */
  /* ------------------------------------------------ */

  render() {
    if (!this.buffer) return;
    this._paint();
  }

  _paint() {
    if (!this.buffer) return;
    const total = this.prefix[this.prefix.length - 1] || 0;
    const first = Math.max(0, Math.floor(this.scrollTop / Math.max(1, this.rowHeight)) - VSLACK);
    const last = Math.min(total, Math.ceil((this.scrollTop + this.viewportH) / Math.max(1, this.rowHeight)) + VSLACK);

    const visible = [];
    for (let g = first; g < last; g++) {
      const { line, local } = this._locateRow(g);
      if (line == null) continue;
      const rows = this._rowsForLine(line);
      const r = rows[local];
      if (!r) continue;
      r.localRow = local;
      visible.push(r);
    }
    this._visibleCache = visible;

    this._paintText(visible);
    this._paintGutter(visible);
    this._paintCurrentLine();
    this._paintSelection();
    this._paintMatches();
    this._paintCaret();
  }

  _paintText(visible) {
    const wrap = this.opts.wrap;
    while (this.domPool.length < visible.length) {
      const el = document.createElement('div');
      el.className = 'vline';
      this.linesEl.appendChild(el);
      this.domPool.push({ el, used: false });
    }
    for (const p of this.domPool) p.used = false;

    for (let k = 0; k < visible.length; k++) {
      const row = visible[k];
      const p = this.domPool[k];
      p.used = true;
      const el = p.el;
      const y = this._globalRowOfRow(row) * this.rowHeight;
      el.style.top = y + 'px';
      el.style.height = this.rowHeight + 'px';
      el.style.lineHeight = this.rowHeight + 'px';
      el.style.direction = row.dir;
      el.style.textAlign = row.dir === 'rtl' ? 'right' : 'left';
      if (wrap) {
        el.style.left = '0';
        el.style.right = '0';
        el.style.width = 'auto';
        el.style.display = '';
      } else {
        el.style.right = 'auto';
        el.style.width = this._rowWidth(row) + 'px';
        el.style.display = '';
      }
      if (el.textContent !== row.text) el.textContent = row.text;
      el.style.visibility = 'visible';
    }
    for (let k = visible.length; k < this.domPool.length; k++) {
      this.domPool[k].used = false;
      this.domPool[k].el.style.visibility = 'hidden';
    }
  }

  _paintCurrentLine() {
    for (const el of this.curLineBgs) el.remove();
    this.curLineBgs = [];
    if (!this._lastCursor || !this.buffer) return;
    const rows = this._rowsForLine(this._lastCursor.line);
    if (!rows) return;
    for (const r of rows) {
      const el = document.createElement('div');
      el.className = 'current-line-bg';
      el.style.top = (this._globalRowOfRow(r) * this.rowHeight) + 'px';
      el.style.height = this.rowHeight + 'px';
      this.linesEl.appendChild(el);
      this.curLineBgs.push(el);
    }
  }

  _paintGutter(visible) {
    if (!this.opts.showLineNumbers) { this.gutterEl.style.display = 'none'; return; }
    this.gutterEl.style.display = '';
    this.gutterEl.style.transform = `translateY(${-this.scrollTop}px)`;
    let used = 0;
    const drawn = new Set();
    for (const row of visible) {
      if (drawn.has(row.line)) continue;
      drawn.add(row.line);
      let le = this.gutterPool[used];
      if (!le) {
        le = document.createElement('div');
        le.className = 'gutter-num';
        this.gutterEl.appendChild(le);
        this.gutterPool.push(le);
      }
      const y = this._globalRowOfRow(row) * this.rowHeight;
      le.style.top = y + 'px';
      le.style.height = this.rowHeight + 'px';
      le.style.lineHeight = this.rowHeight + 'px';
      le.textContent = String(row.line + 1);
      le.classList.toggle('current', !!(this._lastCursor && this._lastCursor.line === row.line));
      le.style.display = '';
      used++;
    }
    for (let i = used; i < this.gutterPool.length; i++) this.gutterPool[i].style.display = 'none';
  }

  /* ------------------------------------------------ */
  /* Selection                                        */
  /* ------------------------------------------------ */

  setSelection(sel) {
    this._sel = sel;
    this._paintSelection();
  }

  _paintSelection() {
    for (const el of this.selPool) el.remove();
    this.selPool = [];
    if (!this._sel || !this.buffer || this._sel.isEmpty) return;
    const startOff = this._sel.start;
    const endOff = this._sel.end;
    const { line: startLine, column: startCol } = this.buffer.offsetToLineColumn(startOff);
    const { line: endLine, column: endCol } = this.buffer.offsetToLineColumn(endOff);

    for (let line = startLine; line <= endLine; line++) {
      if (line >= this.buffer.getLineCount()) break;
      const rows = this._rowsForLine(line);
      const lineLen = this.buffer.getLineLength(line);
      const segStart = line === startLine ? startCol : 0;
      const segEnd = line === endLine ? Math.min(endCol, lineLen) : lineLen;
      for (const row of rows) {
        const a = Math.max(row.startCol, segStart);
        const b = Math.min(row.endCol, segEnd);
        if (a >= b) {
          // interior full row
          if (segStart <= row.startCol && segEnd >= row.endCol) this._addSelRect(row, row.startCol, row.endCol);
          continue;
        }
        this._addSelRect(row, a, b);
      }
    }
  }

  _addSelRect(row, a, b) {
    const x1 = this.docXOfColumn(row, a);
    const x2 = this.docXOfColumn(row, b);
    const y = this._globalRowOfRow(row) * this.rowHeight;
    if (y + this.rowHeight < this.scrollTop || y > this.scrollTop + this.viewportH) return;
    const el = document.createElement('div');
    el.className = 'sel-rect';
    el.style.top = y + 'px';
    el.style.height = this.rowHeight + 'px';
    el.style.left = Math.min(x1, x2) + 'px';
    el.style.width = Math.max(1, Math.abs(x2 - x1)) + 'px';
    this.selectionLayer.appendChild(el);
    this.selPool.push(el);
  }

  /* ------------------------------------------------ */
  /* Find matches                                     */
  /* ------------------------------------------------ */

  setMatches(matches, activeMatch) {
    this.matches = matches || [];
    this.activeMatch = activeMatch || 0;
    this._paintMatches();
  }

  _paintMatches() {
    for (const el of this.matchPool) el.remove();
    this.matchPool = [];
    if (!this.matches.length || !this.buffer) return;
    for (let mi = 0; mi < this.matches.length; mi++) {
      const m = this.matches[mi];
      const { line, column } = this.buffer.offsetToLineColumn(m.start);
      const endLc = this.buffer.offsetToLineColumn(Math.max(m.end - 1, m.start));
      if (endLc.line !== line) {
        // multi-line match: highlight the part on this line
        const rows = this._rowsForLine(line);
        if (!rows) continue;
        const lineLen = this.buffer.getLineLength(line);
        for (const row of rows) {
          const a = Math.max(row.startCol, column);
          if (a < lineLen) this._addMatchRect(row, a, Math.min(row.endCol, lineLen), mi);
        }
        continue;
      }
      const rows = this._rowsForLine(line);
      if (!rows) continue;
      for (const row of rows) {
        const a = Math.max(row.startCol, column);
        const b = Math.min(row.endCol, endLc.column);
        if (a < b) this._addMatchRect(row, a, b, mi);
      }
    }
  }

  _addMatchRect(row, a, b, mi) {
    // Only paint rects fully inside the row; clipped parts painted
    // on their owning row by caller.
    const x1 = this.docXOfColumn(row, a);
    const x2 = this.docXOfColumn(row, b);
    const y = this._globalRowOfRow(row) * this.rowHeight;
    if (y + this.rowHeight < this.scrollTop || y > this.scrollTop + this.viewportH) return;
    const el = document.createElement('div');
    el.className = 'find-match';
    if (mi === this.activeMatch) el.classList.add('active');
    el.style.top = y + 'px';
    el.style.height = this.rowHeight + 'px';
    el.style.left = Math.min(x1, x2) + 'px';
    el.style.width = Math.max(1, Math.abs(x2 - x1)) + 'px';
    this.selectionLayer.appendChild(el);
    this.matchPool.push(el);
  }

  /* ------------------------------------------------ */
  /* Caret                                            */
  /* ------------------------------------------------ */

  moveCursorTo(cursor) {
    this._lastCursor = { line: cursor.line, column: cursor.column };
    this._paintCaret();
  }

  _paintCaret() {
    if (!this._lastCursor || !this.buffer) return;
    const offset = this.buffer.lineColumnToOffset(this._lastCursor.line, this._lastCursor.column);
    const v = this.visualRowOfOffset(offset);
    if (!v || !v.row) return;
    const row = v.row;
    const col = clamp(this._lastCursor.column, row.startCol, row.endCol);
    const x = this.docXOfColumn(row, col);
    const y = this._globalRowOfRow(row) * this.rowHeight;

    this.caretEl.style.top = y + 'px';
    this.caretEl.style.height = this.rowHeight + 'px';
    this.caretEl.style.transform = `translateX(${x}px)`;
    this.caretEl.style.visibility = 'visible';
    this._savedCaretVisible = true;

    // reset blink on movement
    this.caretEl.classList.remove('blink-active');
    void this.caretEl.offsetWidth;
    this.caretEl.classList.add('blink-active');

    const pos = this.positionInputProxy(x, y);
    if (pos) this.caretEl._proxyPos = pos;

    this._ensureVisible(row, x);
  }

  _ensureVisible(row, caretX) {
    const y = this._globalRowOfRow(row) * this.rowHeight;
    const rw = this._rowWidth(row);
    const textLeft = (this.opts.wrap && row.dir === 'rtl') ? this.wrapWidth - rw : 0;
    let st = this.viewport.scrollTop;
    let sl = this.viewport.scrollLeft;
    const pad = 40;
    if (y < st + pad) st = Math.max(0, y - pad);
    else if (y + this.rowHeight > st + this.viewportH - pad) st = Math.max(0, y + this.rowHeight - (this.viewportH - pad));
    if (caretX < sl + pad) sl = Math.max(0, caretX - pad);
    else if (caretX + 8 > sl + this.viewportW - pad) sl = Math.max(0, caretX + 8 - (this.viewportW - pad));
    if (st !== this.scrollTop) this.viewport.scrollTop = st;
    if (sl !== this.scrollLeft) this.viewport.scrollLeft = sl;
    void textLeft;
  }

  positionInputProxy(x, y) {
    const p = document.getElementById('input-proxy');
    if (!p) return null;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    return p;
  }

  /* ------------------------------------------------ */
  /* Hit testing                                      */
  /* ------------------------------------------------ */

  pxToOffset(clientX, clientY) {
    if (!this.buffer) return null;
    const rect = this.viewport.getBoundingClientRect();
    let docX = clientX - rect.left + this.scrollLeft;
    const docY = clientY - rect.top + this.scrollTop;
    if (docX < 0) docX = 0;
    const total = this.prefix[this.prefix.length - 1] || 0;
    let globalRow = Math.floor(docY / Math.max(1, this.rowHeight));
    if (globalRow >= total) {
      return this.buffer.getTotalLength();
    }
    const { line, local } = this._locateRow(globalRow);
    const rows = this._rowsForLine(line);
    const row = rows[local] || rows[rows.length - 1];
    if (!row) return this.buffer.lineColumnToOffset(line, 0);

    const rw = this._rowWidth(row);
    const textLeft = (this.opts.wrap && row.dir === 'rtl') ? this.wrapWidth - rw : 0;
    let xInText = docX - textLeft;
    if (xInText < 0) xInText = 0;
    if (xInText > rw) xInText = rw;
    let col = this.colAtX(row, xInText);
    col = clamp(col, row.startCol, row.endCol);
    return this.buffer.lineColumnToOffset(row.line, col);
  }

  offsetToPx(offset) {
    if (!this.buffer) return { x: 0, y: 0, h: this.rowHeight };
    const v = this.visualRowOfOffset(offset);
    if (!v || !v.row) {
      const { line } = this.buffer.offsetToLineColumn(offset);
      const rows = this._rowsForLine(line);
      const row = rows[rows.length - 1];
      if (!row) return { x: 0, y: this.buffer.lineColumnToOffset(line, 0) ? 0 : 0, h: this.rowHeight };
      const localRow = rows.length - 1;
      row.localRow = localRow;
      const x = this.docXOfColumn(row, offset ? this.buffer.offsetToLineColumn(offset).column : 0);
      const y = (this.prefix[line] + localRow) * this.rowHeight;
      return { x, y, h: this.rowHeight };
    }
    const row = v.row;
    const { column } = this.buffer.offsetToLineColumn(offset);
    const col = clamp(column, row.startCol, row.endCol);
    const x = this.docXOfColumn(row, col);
    const y = this._globalRowOfRow(row) * this.rowHeight;
    return { x, y, h: this.rowHeight };
  }

  /* ------------------------------------------------ */
  /* Visual navigation                                */
  /* ------------------------------------------------ */

  /** Move to the adjacent VISUAL row (dir ±1), keeping caret at the
      same doc-space X. Returns new offset. */
  moveVertically(offset, dir) {
    if (!this.buffer) return offset;
    const cur = this.visualRowOfOffset(offset);
    if (!cur || !cur.row) return offset;
    const curLc = this.buffer.offsetToLineColumn(offset);
    const curCol = clamp(curLc.column, cur.row.startCol, cur.row.endCol);
    const goalX = this.docXOfColumn(cur.row, curCol);

    const g = cur.globalRow + dir;
    if (g < 0) return 0;
    const total = this.prefix[this.prefix.length - 1];
    if (g >= total) return this.buffer.getTotalLength();

    const { line, local } = this._locateRow(g);
    const rows = this._rowsForLine(line);
    const row = rows[local];
    if (!row) return this.buffer.lineColumnToOffset(line, 0);
    row.localRow = local;

    const rw = this._rowWidth(row);
    const textLeft = (this.opts.wrap && row.dir === 'rtl') ? this.wrapWidth - rw : 0;
    let xInText = goalX - textLeft;
    xInText = clamp(xInText, 0, rw);
    let col = this.colAtX(row, xInText);
    col = clamp(col, row.startCol, row.endCol);
    return this.buffer.lineColumnToOffset(line, col);
  }

  visualLineStartOffset(offset) {
    const v = this.visualRowOfOffset(offset);
    if (!v || !v.row) return offset;
    return this.buffer.lineColumnToOffset(v.row.line, v.row.startCol);
  }

  visualLineEndOffset(offset) {
    const v = this.visualRowOfOffset(offset);
    if (!v || !v.row) return offset;
    return this.buffer.lineColumnToOffset(v.row.line, v.row.endCol);
  }

  totalVisualRows() {
    return this.prefix[this.prefix.length - 1] || 0;
  }

  refreshLayout() {
    this._applyFont();
    this.rowCache.clear();
    this._rebuildRowCounts();
    this.render();
  }
}

/* ===== documents.js ===== */
/* ============================================================
   documents.js — one Document = buffer + cursor + selection +
   history + per-doc state + per-doc AI chat.

   These objects are what commands.js operate against: they expose
   `.buffer`, `.cursor`, `.setSelection()` so the Command layer
   stays decoupled from the app chrome.
   ============================================================ */








let counter = 0;

export class Document {
  constructor(opts = {}) {
    this.id = opts.id || uid('doc_');
    this.title = opts.title || 'Untitled';
    this.createdAt = opts.createdAt || Date.now();
    this.updatedAt = opts.updatedAt || Date.now();
    this.dir = opts.dir || 'auto';          // 'auto' | 'ltr' | 'rtl'
    this.isMarkdown = opts.isMarkdown ?? /\.md$/i.test(this.title);

    this.buffer = opts.buffer || new PieceTableBuffer(opts.text || '');
    this.cursor = opts.cursor ? Cursor.deserialize(opts.cursor) : new Cursor(0, 0);
    this.selection = opts.selection
      ? Selection.deserialize(opts.selection)
      : new Selection(0, 0);
    this.history = new HistoryManager(this, { onChange: () => {
      // repaint undo/redo button states
      if (this._onHistoryChange) this._onHistoryChange(this);
    }, limit: 800 });

    this.chat = opts.chat || [];            // per-doc AI chat history
    this.scrollTop = opts.scrollTop || 0;
    this.scrollLeft = opts.scrollLeft || 0;
    this.dirty = false;
    this.onDirtyChange = null;
    this.onVersionBump = null;
    this._onHistoryChange = null;
    this._snapshotScheduled = false;
  }

  /** Convenience accessors the Command layer expects.
      Passing `null` collapses the selection to the CURRENT caret.
      Passing two offsets sets anchor/head explicitly. */
  setSelection(anchor, head) {
    if (anchor == null) {
      const off = this.buffer.lineColumnToOffset(this.cursor.line, this.cursor.column);
      this.selection = new Selection(off, off);
    } else {
      this.selection = new Selection(anchor, head === undefined ? anchor : head);
    }
  }

  getSelectionOffsets() {
    return { start: this.selection.start, end: this.selection.end };
  }

  get text() { return this.buffer.getText(); }

  setDirty(v) {
    if (this.dirty === v) return;
    this.dirty = v;
    if (this.onDirtyChange) this.onDirtyChange(this);
  }

  _bump() {
    this.updatedAt = Date.now();
    this.setDirty(true);
    // signal renderer to invalidate (app subscribes via onVersionBump)
    if (this.onVersionBump) this.onVersionBump(this);
  }

  /* ---------------- Editing API (goes through commands) ---------------- */

  /** Insert text at the current cursor, replacing any selection. */
  typeText(text) {
    if (!text) return;
    const sel = this.getSelectionOffsets();
    let cmd;
    if (sel.end > sel.start) {
      cmd = new ReplaceSelectionCommand(sel, text);
    } else {
      cmd = new InsertTextCommand(sel.start, text);
    }
    this._apply(cmd);
  }

  /** One undo/redo step that also collapses selection. */
  deleteBefore() {
    const sel = this.getSelectionOffsets();
    if (sel.end > sel.start) {
      this._apply(new ReplaceSelectionCommand(sel, ''));
      return;
    }
    const pos = sel.start;
    if (pos <= 0) return;
    this._apply(new DeleteTextCommand(pos - 1, this.buffer.getText(pos - 1, 1)));
  }

  deleteAfter() {
    const sel = this.getSelectionOffsets();
    if (sel.end > sel.start) {
      this._apply(new ReplaceSelectionCommand(sel, ''));
      return;
    }
    const pos = sel.start;
    if (pos >= this.buffer.getTotalLength()) return;
    this._apply(new DeleteTextCommand(pos, this.buffer.getText(pos, 1)));
  }

  deleteWordBefore() {
    const sel = this.getSelectionOffsets();
    if (sel.end > sel.start) {
      this._apply(new ReplaceSelectionCommand(sel, ''));
      return;
    }
    const pos = this._wordStart(sel.start);
    if (pos === sel.start) return;
    this._apply(new DeleteTextCommand(pos, this.buffer.getText(pos, sel.start - pos)));
  }

  deleteWordAfter() {
    const sel = this.getSelectionOffsets();
    if (sel.end > sel.start) {
      this._apply(new ReplaceSelectionCommand(sel, ''));
      return;
    }
    const pos = this._wordEnd(sel.start);
    if (pos === sel.start) return;
    this._apply(new DeleteTextCommand(sel.start, this.buffer.getText(sel.start, pos - sel.start)));
  }

  _wordStart(offset) {
    const { line, column } = this.buffer.offsetToLineColumn(offset);
    const text = this.buffer.getLine(line);
    let i = column;
    while (i > 0 && !(/\s/u).test(text[i - 1])) i--;
    return this.buffer.lineColumnToOffset(line, i);
  }

  _wordEnd(offset) {
    const { line, column } = this.buffer.offsetToLineColumn(offset);
    const text = this.buffer.getLine(line);
    const lineEnd = this.buffer.lineColumnToOffset(line, text.length);
    let i = column;
    while (i < text.length && !(/\s/u).test(text[i])) i++;
    if (i === text.length) return lineEnd;
    return this.buffer.lineColumnToOffset(line, i);
  }

  /** Replace a range with text as one atomic undoable edit. */
  replaceRange(start, end, replacement) {
    this._apply(new ReplaceSelectionCommand({ start, end }, replacement));
  }

  replaceAllMatches(matches, replacementStr, { regex } = {}) {
    // run as one composite command applied back-to-front
    const cmds = [];
    const buf = this.buffer;
    for (let i = matches.length - 1; i >= 0; i--) {
      const m = matches[i];
      cmds.push(new ReplaceSelectionCommand({ start: m.start, end: m.end }, replacementStr));
    }
    const composite = new CompositeCommand(cmds);
    composite.execute(this);
    this.history.undoStack.push(composite);
    this.history.redoStack.length = 0;
    this.history._trim();
    this._bump();
    if (this._onHistoryChange) this._onHistoryChange(this);
    void buf; void regex;
  }

  _apply(cmd) {
    cmd.execute(this);
    this.history.undoStack.push(cmd);
    this.history.redoStack.length = 0;
    this.history._trim();
    this._bump();
    if (this._onHistoryChange) this._onHistoryChange(this);
  }

  undo() {
    if (this.history.undo()) this._bump();
  }
  redo() {
    if (this.history.redo()) this._bump();
  }

  /* ---------------- Persistence shape ---------------- */

  serialize() {
    return {
      id: this.id,
      title: this.title,
      text: this.buffer.serialize(),
      cursor: this.cursor.serialize(),
      selection: this.selection.serialize(),
      dir: this.dir,
      isMarkdown: this.isMarkdown,
      createdAt: this.createdAt,
      updatedAt: this.updatedAt,
      scrollTop: this.scrollTop,
      scrollLeft: this.scrollLeft,
      chat: this.chat.slice(-200),
    };
  }
}

/** Search across one (or all) documents for the Find feature. */
export function findInDoc(doc, query, opts = {}) {
  const text = doc.buffer.getText();
  if (!query) return [];
  const matches = [];
  const { caseSensitive = false, wholeWord = false, regex = false } = opts;
  let hay = text;
  let q = query;
  if (!caseSensitive) { hay = hay.toLowerCase(); q = q.toLowerCase(); }
  let re = null;
  let useRegex = regex;
  if (useRegex) {
    try {
      re = new RegExp(q, 'g');
    } catch {
      re = null;
      useRegex = false;
    }
  }
  if (useRegex && re) {
    let m;
    while ((m = re.exec(hay)) !== null) {
      const start = m.index;
      const end = start + m[0].length;
      if (wholeWord && !isWholeWord(hay, start, end)) { if (m[0].length === 0) re.lastIndex++; continue; }
      matches.push({ start, end });
      if (m[0].length === 0) re.lastIndex++; // prevent infinite loop
    }
  } else {
    let idx = hay.indexOf(q);
    while (idx !== -1) {
      const end = idx + q.length;
      if (!wholeWord || isWholeWord(hay, idx, end)) {
        matches.push({ start: idx, end });
      }
      idx = hay.indexOf(q, idx + Math.max(1, q.length));
    }
  }
  return matches;
}

function isWholeWord(hay, start, end) {
  const before = start > 0 ? hay[start - 1] : ' ';
  const after = end < hay.length ? hay[end] : ' ';
  const wc = (c) => c === undefined || !(/[\p{L}\p{N}_]/u).test(c);
  return wc(before) && wc(after);
}

/* ===== input.js ===== */
/* ============================================================
   input.js — translates raw keyboard / mouse / IME events into
   Commands, and moves the cursor.

   TEXT ENTRY STRATEGY
   -------------------
   The editor caret is our own DOM element, but translating every
   possible input event (IME composition, Arabic keyboard, emoji
   picker, mobile virtual keyboards, dead keys…) yourself is a
   losing battle. Instead we keep a tiny nearly-invisible textarea
   ("input-proxy") parked exactly at the caret and OUT of the
   user's visual view. All text entry funnels through it:
     - beforeinput 'insertText'/'insertLineBreak' → insert,
     - compositionstart/end (IME) → insert the composed string,
     - 'paste' → clipboard text via ReplaceSelectionCommand.
   The proxy is reset after each event so we don't accumulate
   ghost text. Native shortcuts (Bold via Ctrl+B, etc.) are all
   prevented and handled by us.

   EVERY edit goes through history.push / a typing group → every
   edit is undoable (see history.js).
   ============================================================ */




export class InputController {
  constructor(app) {
    this.app = app;
    this._mouseState = null;
    this._lastHomeEnd = 0;
    this._lastHomeEndWasStart = false;
    this._groupTimer = null;
    this.composing = false;
    this._selecting = false;
    this._dragScrollRAF = null;
  }

  get doc() { return this.app.getActiveDoc(); }
  get renderer() { return this.app.renderer; }

  attach() {
    this._proxy = document.getElementById('input-proxy');

    document.addEventListener('keydown', (e) => this._onKeyDown(e), true);
    document.addEventListener('mousedown', (e) => this._onMouseDown(e));
    document.addEventListener('mouseup', (e) => this._onMouseUp(e));
    document.addEventListener('mousemove', (e) => this._onMouseMove(e));
    document.addEventListener('dblclick', (e) => this._onDoubleClick(e));
    document.addEventListener('dragover', (e) => this._onDragOver(e));
    document.addEventListener('drop', (e) => this._onDrop(e));

    this._proxy.addEventListener('beforeinput', (e) => this._onBeforeInput(e));
    this._proxy.addEventListener('compositionstart', () => { this.composing = true; this._commitGroup(); });
    this._proxy.addEventListener('compositionend', (e) => { this.composing = false; this._flushProxy(); });
    this._proxy.addEventListener('paste', (e) => this._onProxyPaste(e));
    this._proxy.addEventListener('copy', (e) => this._onProxyCopyCut(e, false));
    this._proxy.addEventListener('cut', (e) => this._onProxyCopyCut(e, true));
    this._proxy.addEventListener('input', () => this._flushProxy());
    this._proxy.addEventListener('focus', () => document.body.classList.add('using-keyboard'));
    this._proxy.addEventListener('blur', () => document.body.classList.remove('using-keyboard'));

    if ('onmousedown' in window) {
      const touch = 'ontouchstart' in window;
      if (touch) {
        this.renderer.viewport.addEventListener('touchstart', (e) => this._onTouchStart(e), { passive: false });
      }
    }
  }

  focusEditor() {
    const d = this.doc;
    if (!d) return;
    document.body.classList.add('using-keyboard');
    // Place the caret + proxy at the cursor.
    this.app.paintCaret();
    const { x, y } = this._caretPx();
    this.renderer.positionInputProxy(x, y);
    this._proxy.focus({ preventScroll: true });
    if (typeof this._proxy.scrollIntoView === 'function') {
      // keep the proxy visually parked; don't scroll the page
    }
  }

  _focusProxy() {
    if (!this._proxy) this._proxy = document.getElementById('input-proxy');
    const d = this.doc;
    if (!d) return;
    this.app.paintCaret();
    const { x, y } = this._caretPx();
    this.renderer.positionInputProxy(x, y);
    this._proxy.focus({ preventScroll: true });
  }

  _caretPx() {
    const d = this.doc;
    const off = d.buffer.lineColumnToOffset(d.cursor.line, d.cursor.column);
    const p = this.renderer.offsetToPx(off);
    return { x: p.x, y: p.y };
  }

  /* ---------------- Typing group management ---------------- */

  _beginGroup() {
    const h = this.doc.history;
    h.beginGroup();
    clearTimeout(this._groupTimer);
  }

  _commitGroup() {
    const h = this.doc.history;
    if (h.endGroup()) this.app.historyChanged();
    clearTimeout(this._groupTimer);
  }

  _armGroupTimer() {
    clearTimeout(this._groupTimer);
    this._groupTimer = setTimeout(() => this._commitGroup(), 700);
  }

  /** Insert text (from beforeinput / IME / paste-without-command). */
  insertText(text) {
    const d = this.doc;
    if (!text) return;
    const h = d.history;
    const fresh = !h.isGroupOpen;
    const sel = d.getSelectionOffsets();
    h.beginGroup();
    let cmd;
    if (fresh && sel.end > sel.start) {
      // First keystroke of a burst: replace the active selection once.
      cmd = new ReplaceSelectionCommand(sel, text);
    } else if (sel.end > sel.start) {
      cmd = new ReplaceSelectionCommand(sel, text);
    } else {
      cmd = new InsertTextCommand(sel.start, text);
    }
    cmd.execute(d);
    h.openGroup.add(cmd);
    this.app.afterEdit(sel.start, text);
    this._armGroupTimer();
  }

  /* ---------------- Event handlers ---------------- */

  _onKeyDown(e) {
    const d = this.doc;
    if (!d) return;
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key;
    const handled = this._dispatchShortcut(e, mod, e.shiftKey, key);
    if (handled === true) {
      e.preventDefault();
      if (mod || ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(key)) {
        this._commitGroup();
      }
    }
  }

  _dispatchShortcut(e, mod, shift, key) {
    const app = this.app;
    const d = this.doc;

    // --- Text-producing keys handled natively by the proxy ---
    if (key === 'Unidentified' && this.composing) return true;

    // Application shortcuts
    if (mod) {
      const k = key.toLowerCase();
      switch (k) {
        case 'z':
          if (shift) d.redo(); else d.undo();
          this._commitGroup();
          return true;
        case 'y': d.redo(); this._commitGroup(); return true;
        case 'a': this.selectAll(); return true;
        case 'n': app.newDocument(); return true;
        case 'o': e.preventDefault(); app.openFile(); return true;
        case 's': app.exportCurrent(); return true;
        case 'f': app.find.open(); return true;
        case 'k': app.ai.togglePanel(); return true;
        case '/': app.help.show(); return true;
        case 'm': if (shift) { app.togglePreview(); return true; } break;
        case 'g': app.toggleOutline(); return true;
        case 'b': if (app.ai.panelOpen) { app.ai.togglePanel(); return true; } break;
        case '=': case '+': app.zoomIn(); return true;
        case '-': case '_': app.zoomOut(); return true;
        case '0': app.resetZoom(); return true;
      }
      return false;
    }

    if (key === 'F11') { e.preventDefault(); app.toggleFocusMode(); return true; }

    // -- Caret / editing keys --
    switch (key) {
      case 'Backspace':
        this._commitGroup();
        this.autoIndentIfNeeded();
        d.deleteBefore();
        this._afterEditAction();
        return true;
      case 'Delete':
        this._commitGroup();
        d.deleteAfter();
        this._afterEditAction();
        return true;
      case 'Enter': case 'NumpadEnter':
        // handled via beforeinput insertLineBreak; nothing here
        return false;
      case 'Tab':
        if (!shift) {
          this.insertText('\t');
          return true;
        }
        e.preventDefault();
        return true;
      case 'ArrowLeft': this.moveHoriz(-1, shift); return true;
      case 'ArrowRight': this.moveHoriz(1, shift); return true;
      case 'ArrowUp': this.moveVert(-1, shift); return true;
      case 'ArrowDown': this.moveVert(1, shift); return true;
      case 'Home':
        if (mod) { this.moveToDocStart(shift); return true; }
        this.homeEnd(false, shift); return true;
      case 'End':
        if (mod) { this.moveToDocEnd(shift); return true; }
        this.homeEnd(true, shift); return true;
      case 'PageUp':
        if (mod) { this.moveToDocStart(shift); return true; }
        this.movePage(-1, shift); return true;
      case 'PageDown':
        if (mod) { this.moveToDocEnd(shift); return true; }
        this.movePage(1, shift); return true;
    }

    if (mod && key === 'ArrowLeft') { this.moveWord(-1, shift); return true; }
    if (mod && key === 'ArrowRight') { this.moveWord(1, shift); return true; }

    return false;
  }

  _onBeforeInput(e) {
    const d = this.doc;
    if (!d) return;
    if (this.composing) { e.preventDefault(); return; } // IME handles text
    const t = e.inputType;
    if (t === 'insertText' || t === 'insertLineBreak' || t === 'insertParagraph' || t === 'insertFromPaste' || t === 'insertCompositionText') {
      e.preventDefault();
      let text = '';
      if (e.data != null) text = e.data;
      else if (t === 'insertLineBreak' || t === 'insertParagraph') text = '\n';
      if (t === 'insertCompositionText') { /* handled by compositionend */ return; }
      if (text) {
        this._beginGroup();
        this.insertText(text);
      }
    } else if (t === 'deleteContentBackward' || t === 'deleteContentForward' || t === 'deleteWordBackward' || t === 'deleteWordForward') {
      e.preventDefault();
      this._commitGroup();
      if (t === 'deleteWordBackward') d.deleteWordBefore();
      else if (t === 'deleteWordForward') d.deleteWordAfter();
      else if (t === 'deleteContentBackward') d.deleteBefore();
      else d.deleteAfter();
      this._afterEditAction();
    }
  }

  _flushProxy() {
    const p = this._proxy;
    if (this.composing) return;
    const val = p.value;
    if (val && val.length) {
      this.insertText(val);
    }
    p.value = '';
  }

  _onProxyPaste(e) {
    e.preventDefault();
    const d = this.doc;
    if (!d) return;
    this._commitGroup();
    let text = '';
    if (e.clipboardData && e.clipboardData.getData) {
      text = e.clipboardData.getData('text/plain');
    }
    if (!text && navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then((t) => {
        if (t) this.insertText(t);
        this._afterEditAction();
      }).catch(() => this.app.toast('toastCantPaste', { type: 'warning' }));
      return;
    }
    if (text) { this.insertText(text); this._afterEditAction(); }
  }

  _onProxyCopyCut(e, cut) {
    const d = this.doc;
    if (!d) return;
    const sel = d.getSelectionOffsets();
    if (sel.end <= sel.start) return;
    const text = d.buffer.getText(sel.start, sel.end - sel.start);
    e.preventDefault();
    if (e.clipboardData && e.clipboardData.setData) {
      e.clipboardData.setData('text/plain', text);
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => this.app.toast('toastCantPaste', { type: 'warning' }));
    }
    if (cut) {
      this._commitGroup();
      d.replaceRange(sel.start, sel.end, '');
      this._afterEditAction();
    }
  }

  /* ---------------- Movement ---------------- */

  _curOffset() {
    const d = this.doc;
    return d.buffer.lineColumnToOffset(d.cursor.line, d.cursor.column);
  }

  _lineDirection(lineIdx) {
    const d = this.doc;
    const text = d.buffer.getLine(lineIdx);
    let dir = detectLineDirection(text);
    if (dir === 'neutral') dir = d.dir === 'rtl' ? 'rtl' : 'ltr';
    return dir;
  }

  /** Character under/in-front-of the cursor, for run-direction. */
  _runDirAt(offset) {
    const d = this.doc;
    const { line, column } = d.buffer.offsetToLineColumn(offset);
    const text = d.buffer.getLine(line);
    const ch = text[Math.min(column, text.length - 1)];
    if (ch && isArabicCharCode(ch.codePointAt(0))) return 'rtl';
    const ch2 = column < text.length ? text[column] : (text[column - 1] || '');
    if (ch2 && isArabicCharCode(ch2.codePointAt(0))) return 'rtl';
    return this._lineDirection(line);
  }

  moveHoriz(dir, shift) {
    const d = this.doc;
    const startOff = this._curOffset();
    const runDir = this._runDirAt(startOff);
    const lineText = d.buffer.getLine(d.buffer.offsetToLineColumn(startOff).line);
    const isRtl = runDir === 'rtl';
    let off;
    if (dir === 1) {
      // visually right: in RTL that's logical previous
      off = isRtl ? this._prevGraphemeOffset(startOff) : this._nextGraphemeOffset(startOff);
    } else {
      off = isRtl ? this._nextGraphemeOffset(startOff) : this._prevGraphemeOffset(startOff);
    }
    void lineText;
    this._finishMove(off, shift);
  }

  moveWord(dir, shift) {
    const d = this.doc;
    const startOff = this._curOffset();
    const runDir = this._runDirAt(startOff);
    const isRtl = runDir === 'rtl';
    const text = d.buffer.getText();
    // jump direction in logical terms
    const logicalDir = (dir === 1) !== isRtl ? 1 : -1;
    let off = startOff;
    if (logicalDir === 1) off = this._nextWordOffset(startOff);
    else off = this._prevWordOffset(startOff);
    void text;
    this._finishMove(off, shift);
  }

  _prevGraphemeOffset(off) {
    const d = this.doc;
    if (off <= 0) return 0;
    const { line, column } = d.buffer.offsetToLineColumn(off);
    const text = d.buffer.getLine(line);
    if (column === 0) {
      if (line === 0) return 0;
      const prevLine = d.buffer.getLine(line - 1);
      return d.buffer.lineColumnToOffset(line - 1, prevLine.length);
    }
    const nc = prevGrapheme(text, column);
    return d.buffer.lineColumnToOffset(line, nc);
  }

  _nextGraphemeOffset(off) {
    const d = this.doc;
    const { line, column } = d.buffer.offsetToLineColumn(off);
    const text = d.buffer.getLine(line);
    if (column >= text.length) {
      const end = d.buffer.lineEndOf(off);
      return Math.min(end, d.buffer.getTotalLength());
    }
    const n = nextGrapheme(text, column);
    if (text[n] === '\n' || n > text.length) { /* n/a */ }
    // clamp: if n lands past the line text, stay at line end
    return d.buffer.lineColumnToOffset(line, Math.min(n, text.length));
  }

  _prevWordOffset(off) {
    const d = this.doc;
    const { line, column } = d.buffer.offsetToLineColumn(off);
    const text = d.buffer.getLine(line);
    let i = column;
    if (i > 0 && isWordCharAt(text, i - 1)) {
      while (i > 0 && isWordCharAt(text, i - 1)) i--;
    } else {
      while (i > 0 && !isWordCharAt(text, i - 1) && text[i - 1] !== '\n') i--;
    }
    if (i === 0 && line > 0) {
      const prev = d.buffer.getLine(line - 1);
      let j = prev.length;
      while (j > 0 && isWordCharAt(prev, j - 1)) j--;
      return d.buffer.lineColumnToOffset(line - 1, j);
    }
    return d.buffer.lineColumnToOffset(line, i);
  }

  _nextWordOffset(off) {
    const d = this.doc;
    const { line, column } = d.buffer.offsetToLineColumn(off);
    const text = d.buffer.getLine(line);
    let i = column;
    while (i < text.length && !isWordCharAt(text, i)) i++;
    while (i < text.length && isWordCharAt(text, i)) i++;
    return d.buffer.lineColumnToOffset(line, i);
  }

  moveVert(dir, shift) {
    const d = this.doc;
    const off = this._curOffset();
    const target = this.renderer.moveVertically(off, dir);
    this._finishMove(target, shift);
  }

  movePage(dir, shift) {
    const d = this.doc;
    const off = this._curOffset();
    const rows = Math.max(1, Math.floor(this.renderer.viewportH / (this.renderer.rowHeight || 16)) - 1);
    let target = off;
    for (let i = 0; i < rows; i++) {
      const t2 = this.renderer.moveVertically(target, dir);
      if (t2 === target) break;
      target = t2;
    }
    this._finishMove(target, shift);
  }

  homeEnd(isEnd, shift) {
    const d = this.doc;
    const now = Date.now();
    const off = this._curOffset();
    const quick = now - this._lastHomeEnd < 400;
    const logical = quick && this._lastHomeEndWasStart === isEnd;
    this._lastHomeEnd = now;
    this._lastHomeEndWasStart = isEnd;

    let target;
    if (logical) {
      if (isEnd) {
        const { line } = d.buffer.offsetToLineColumn(this._curOffset());
        const lineLen = d.buffer.getLineLength(line);
        target = d.buffer.lineColumnToOffset(line, lineLen);
      } else {
        target = d.buffer.lineStartOf(this._curOffset());
      }
    } else {
      target = isEnd ? this.renderer.visualLineEndOffset(off) : this.renderer.visualLineStartOffset(off);
    }
    this._finishMove(target, shift);
  }

  moveToDocStart(shift) { this._finishMove(0, shift); }
  moveToDocEnd(shift) {
    const d = this.doc;
    this._finishMove(d.buffer.getTotalLength(), shift);
  }

  _finishMove(target, shift) {
    const d = this.doc;
    this._commitGroup();
    if (shift) {
      const cur = this._curOffset();
      const sel = d.selection;
      let anchor = (sel && sel.active && sel.end > sel.start) ? sel.anchor : cur;
      if (anchor == null) anchor = cur;
      this._selAnchor = this._selAnchor || anchor;
      d.selection = new (d.selection.constructor)(this._selAnchor, target);
      d.selection.active = true;
    } else {
      this._selAnchor = null;
      const lc = d.buffer.offsetToLineColumn(target);
      d.cursor.setPosition(lc.line, lc.column, { resetGoal: true });
      d.setSelection(null);
    }
    this.app.afterMove();
  }

  /** Replace-all cursor position after an atomic edit. */
  _afterEditAction() {
    this.app.afterEdit(null, null);
  }

  _beforeEditAction(fn) {
    fn();
    this.app.afterEdit(null, null);
  }

  autoIndentIfNeeded() {
    // When deleting an indented line start, keep it simple: no-op.
  }

  selectAll() {
    const d = this.doc;
    this._commitGroup();
    d.setSelection(0, d.buffer.getTotalLength());
    this.app.afterMove();
  }

  /* ---------------- Mouse ---------------- */

  _onMouseDown(e) {
    const app = this.app;
    if (app.ai.panelOpen && e.target.closest('#ai-panel')) return;
    if (e.button !== 0) return;
    const d = this.doc;
    if (!d) return;

    // focus mode click exits
    if (app.focusMode && !e.target.closest('#viewport')) { app.toggleFocusMode(); return; }

    const inViewport = this.renderer.viewport.contains(e.target);
    if (!inViewport && !e.target.closest('#gutter')) return;
    if (e.target.closest('.gutter')) {
      // click on gutter → select that line
      const vp = this.renderer.viewport.getBoundingClientRect();
      const docY = e.clientY - vp.top + this.renderer.scrollTop;
      const globalRow = Math.floor(docY / this.renderer.rowHeight);
      const { line } = this.renderer._locateRow(globalRow);
      if (line == null) return;
      const start = this.renderer.buffer.lineStartOf(this.renderer.buffer.lineColumnToOffset(line, 0));
      const end = this.renderer.buffer.lineEndOf(start);
      d.setSelection(start, end);
      this.app.afterMove();
      return;
    }

    e.preventDefault();
    const off = this.renderer.pxToOffset(e.clientX, e.clientY);
    if (off == null) return;
    this._commitGroup();

    if (e.shiftKey) {
      // extend from existing anchor
      const anchor = d.selection.active && d.selection.end > d.selection.start ? d.selection.anchor : this._curOffset();
      d.setSelection(anchor, off);
    } else {
      d.setSelection(off, off);
      const lc = d.buffer.offsetToLineColumn(off);
      d.cursor.setPosition(lc.line, lc.column, { resetGoal: true });
    }
    this.app.afterMove();

    // Ensure a click always returns keyboard focus to the hidden proxy so
    // subsequent typing is captured (mousedown stealing focus otherwise
    // leaves the editor dead until a manual focusEditor() call).
    this._focusProxy();

    this._selecting = true;
    this._mouseState = { lastX: e.clientX, lastY: e.clientY, anchor: off, mode: 'select' };
    if (e.detail === 2 || e.detail === 3) {
      // handled in dblclick
    }
  }

  _onMouseMove(e) {
    if (!this._selecting || !this._mouseState) return;
    const d = this.doc;
    if (!d) return;
    e.preventDefault();
    this._mouseState.lastX = e.clientX;
    this._mouseState.lastY = e.clientY;
    const off = this.renderer.pxToOffset(e.clientX, e.clientY);
    if (off != null) {
      const sel = d.selection || { anchor: this._mouseState.anchor };
      sel.head = off;
      sel.anchor = this._mouseState.anchor;
      sel.active = true;
      d.selection = sel;
      this.app.afterMove();
    }
    this._autoScroll(e.clientX, e.clientY);
  }

  _onMouseUp() {
    this._selecting = false;
    this._stopAutoScroll();
  }

  _onDoubleClick(e) {
    if (!this.renderer.viewport.contains(e.target)) return;
    const d = this.doc;
    if (!d) return;
    e.preventDefault();
    const off = this.renderer.pxToOffset(e.clientX, e.clientY);
    if (off == null) return;
    if (e.detail === 2) {
      // select word at offset
      const text = d.buffer.getText();
      let s = off, en = off;
      while (s > 0 && isWordCharAt(text, s - 1)) s--;
      while (en < text.length && isWordCharAt(text, en)) en++;
      if (en > s) { d.setSelection(s, en); }
      else { d.setSelection(off, off); }
      this.app.afterMove();
    } else if (e.detail === 3) {
      const { line } = d.buffer.offsetToLineColumn(off);
      const s = d.buffer.lineStartOf(d.buffer.lineColumnToOffset(line, 0));
      const en2 = d.buffer.lineEndOf(s);
      d.setSelection(s, en2);
      this.app.afterMove();
    }
  }

  _onTouchStart(e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    this._onMouseDown({ clientX: t.clientX, clientY: t.clientY, button: 0, target: t.target, preventDefault: () => e.preventDefault(), detail: 1, shiftKey: false });
    e.preventDefault();
  }

  _autoScroll(x, y) {
    const vp = this.renderer.viewport;
    const r = vp.getBoundingClientRect();
    const margin = 32;
    let dx = 0, dy = 0;
    if (y < r.top + margin) dy = -6;
    else if (y > r.bottom - margin) dy = 6;
    if (x < r.left + margin) dx = -6;
    else if (x > r.right - margin) dx = 6;
    if (dy === 0 && dx === 0) { this._stopAutoScroll(); return; }
    if (!this._dragScrollRAF) {
      const tick = () => {
        vp.scrollTop += dy * 2;
        vp.scrollLeft += dx * 2;
        this._dragScrollRAF = requestAnimationFrame(tick);
      };
      this._dragScrollRAF = requestAnimationFrame(tick);
    }
  }

  _stopAutoScroll() {
    if (this._dragScrollRAF) { cancelAnimationFrame(this._dragScrollRAF); this._dragScrollRAF = null; }
  }

  /* ---------------- Drag & drop files ---------------- */

  _onDragOver(e) {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
      e.preventDefault();
      this.app.showDragOverlay(true);
    }
  }

  _onDrop(e) {
    const files = e.dataTransfer && e.dataTransfer.files;
    this.app.showDragOverlay(false);
    if (!files || !files.length) return;
    e.preventDefault();
    const f = files[0];
    if (f) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        this.app.importDocument(f.name, text);
      };
      reader.readAsText(f);
    }
  }
}

/* ===== ai.js ===== */
/* ============================================================
   ai.js — AI assistant panel + provider-agnostic adapter.

   SECURITY MODEL
   --------------
   The API key is stored in localStorage (plain text) and sent ONLY
   from this page directly to the chosen provider's API via fetch.
   It never touches any other server. A one-time visible disclaimer
   tells the user this.

   PROVIDERS
   ---------
   - Gemini         : Google REST  (generateContent / streamGenerateContent)
   - OpenAI         : /v1/chat/completions
   - DeepSeek       : OpenAI-compatible  https://api.deepseek.com/v1
   - Kimi (Moonshot): OpenAI-compatible  https://api.moonshot.cn/v1
   - Custom         : any OpenAI-compatible base URL
   All non-Gemini providers share the streaming SSE format, so we
   parse it once. Gemini has its own SSE shape.
   ============================================================ */




export const PROVIDERS = {
  gemini: {
    label: 'Google Gemini',
    baseUrl: 'https://generativelanguage.googleapis.com',
    model: 'gemini-2.0-flash',
    style: 'gemini',
  },
  openai: {
    label: 'OpenAI',
    baseUrl: 'https://api.openai.com/v1',
    model: 'gpt-4o-mini',
    style: 'openai',
  },
  deepseek: {
    label: 'DeepSeek',
    baseUrl: 'https://api.deepseek.com/v1',
    model: 'deepseek-chat',
    style: 'openai',
  },
  kimi: {
    label: 'Kimi (Moonshot)',
    baseUrl: 'https://api.moonshot.cn/v1',
    model: 'moonshot-v1-8k',
    style: 'openai',
  },
  custom: {
    label: 'Custom (OpenAI-compatible)',
    baseUrl: '',
    model: '',
    style: 'openai',
  },
};

export function aiConfig() {
  const cfg = storage.lsGet('ai', null) || {
    provider: 'openai',
    apiKey: '',
    model: '',
    baseUrl: '',
    gKeyConfirmed: false,
  };
  return cfg;
}

export function saveAiConfig(cfg) {
  storage.lsSet('ai', {
    provider: cfg.provider || 'openai',
    apiKey: cfg.apiKey || '',
    model: cfg.model || '',
    baseUrl: cfg.baseUrl || '',
    gKeyConfirmed: true,
  });
}

export function clearAiConfig() { storage.lsDel('ai'); }

/** Translate a fetch error / status into an i18n key. */
function statusToErrKey(status) {
  if (status === 401 || status === 403) return 'aiErrInvalidKey';
  if (status === 429) return 'aiErrQuota';
  if (status === 404) return 'aiErrModel';
  if (status >= 500) return 'aiErrServer';
  return 'aiErrUnknown';
}

export function parseError(status, msg) {
  return {
    key: statusToErrKey(status),
    detail: msg && typeof msg === 'string' ? msg.slice(0, 300) : '',
  };
}

/**
 * Send a chat request. Normalizes {role, content} messages across
 * providers. Supports streaming via the `onToken` callback.
 * Returns the full response text (even when streaming).
 */
export async function sendMessage(cfg, messages, { onToken, signal } = {}) {
  const provider = PROVIDERS[cfg.provider] || PROVIDERS.openai;
  if (!cfg.apiKey) throw Object.assign(new Error('NO_KEY'), { status: -1 });

  if (provider.style === 'gemini') {
    return sendGemini(cfg, messages, { onToken }, provider, signal);
  }
  return sendOpenAICompat(cfg, messages, { onToken }, provider, signal);
}

async function sendGemini(cfg, messages, { onToken }, provider, signal) {
  const model = cfg.model || provider.model;
  const url = `${provider.baseUrl}/v1beta/models/${encodeURIComponent(model)}:${onToken ? 'streamGenerateContent' : 'generateContent'}?alt=${onToken ? 'sse' : 'json'}&key=${encodeURIComponent(cfg.apiKey)}`;
  const contents = messages
    .filter(m => (m.content || '').trim())
    .map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } }),
    signal,
  });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.error && (j.error.message || '') || j.error || ''; } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  if (!onToken) {
    const j = await res.json();
    const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    return text || '';
  }
  // SSE streaming
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buffer = '';
  let out = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    let i;
    while ((i = buffer.indexOf('\n')) !== -1) {
      const line = buffer.slice(0, i).trim();
      buffer = buffer.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const cand = (j.candidates?.[0]?.content?.parts || [])[0];
        const t = cand ? cand.text || '' : '';
        if (t) { out += t; onToken(t); }
      } catch {}
    }
  }
  return out;
}

async function sendOpenAICompat(cfg, messages, { onToken }, provider, signal) {
  const base = (cfg.baseUrl || provider.baseUrl).replace(/\/+$/, '');
  const model = cfg.model || provider.model;
  const url = `${base}/chat/completions`;
  const body = {
    model,
    messages: messages.map(m => ({ role: m.role, content: m.content })),
    stream: !!onToken,
    temperature: 0.7,
  };
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${cfg.apiKey}`,
    },
    body: JSON.stringify(body),
    signal,
  });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.error?.message || JSON.stringify(j.error || '').slice(0, 200); } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  if (!onToken) {
    const j = await res.json();
    return j.choices?.[0]?.message?.content || '';
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buffer = '';
  let out = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    let i;
    while ((i = buffer.indexOf('\n')) !== -1) {
      const line = buffer.slice(0, i).trim();
      buffer = buffer.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const d = j.choices?.[0]?.delta?.content || '';
        if (d) { out += d; onToken(d); }
      } catch {}
    }
  }
  return out;
}

/* ============================================================
   AiAssistant — the side panel UI + chat wiring.
   ============================================================ */

const SYS = `You are a helpful writing assistant embedded in a bilingual (English+Arabic) offline text editor. Respond in the language the user uses. Be concise. When rewriting/translating, output ONLY the resulting text (no explanations), so it can be inserted directly into the document.`;

const QA_PROMPTS = {
  qaGrammar: 'Fix the grammar and spelling of the following text. Output only the corrected text:',
  qaRewrite: 'Rewrite the following paragraph to improve clarity and flow. Output only the rewritten text:',
  qaContinue: 'Continue the following text naturally from where it stops. Output only the continuation:',
  qaSummarize: 'Summarize the following text in 3-4 sentences:',
  qaTranslateAr: 'Translate the following text into Arabic. Output only the Arabic translation:',
  qaTranslateEn: 'Translate the following text into English. Output only the English translation:',
  qaFormal: 'Rewrite the following text in a formal register. Output only the rewritten text:',
  qaCasual: 'Rewrite the following text in a casual, friendly register. Output only the rewritten text:',
  qaExplain: 'Explain what the following text means, in simple language:',
};

export class AiAssistant {
  constructor(app) {
    this.app = app;
    this.panel = document.getElementById('ai-panel');
    this.chatEl = document.getElementById('ai-chat');
    this.inputEl = document.getElementById('ai-input');
    this.quickEl = document.getElementById('ai-quick');
    this.titleEl = document.getElementById('ai-panel-title');
    this.panelOpen = false;
    this._busy = false;
    this._abort = null;
    this._inSettings = false;
    this._bind();
  }

  _bind() {
    const resize = () => {
      this.inputEl.style.height = 'auto';
      this.inputEl.style.height = Math.min(160, this.inputEl.scrollHeight) + 'px';
    };
    this.inputEl.addEventListener('input', resize);
  }

  get cfg() { return aiConfig(); }

  /* ---------------- open/close ---------------- */

  togglePanel() {
    if (this.panelOpen) this.closePanel();
    else this.openPanel();
  }

  openPanel() {
    this.panelOpen = true;
    this.app.setAIPanelOpen(true);
    this._render();
    this.inputEl.focus({ preventScroll: true });
  }

  closePanel() {
    this.panelOpen = false;
    this.app.setAIPanelOpen(false);
  }

  _render() {
    this.quickEl.textContent = '';
    if (this.app.online !== false && !this.cfg.apiKey) {
      this._renderEmpty();
      return;
    }
    if (!navigator.onLine && !this.cfg.apiKey) {
      this._renderOffline();
      return;
    }
    if (this._inSettings) { this._renderSettings(); return; }
    this._renderChat();
  }

  toggleSettings() {
    this._inSettings = !this._inSettings;
    this._render();
  }

  _renderEmpty() {
    const t = i18n;
    this.chatEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'empty-state ai-empty';
    div.innerHTML = `
      <svg class="ic es-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2z"/></svg>
      <strong>${t.t('aiEmptyTitle')}</strong>
      <p>${t.t('aiEmptyBody')}</p>
      <button class="text-btn primary">${t.t('aiOpenSettings')}</button>`;
    div.querySelector('button').addEventListener('click', () => { this._inSettings = true; this._render(); });
    this.chatEl.appendChild(div);
    this._buildQuick([]);
  }

  _renderOffline() {
    const t = i18n;
    this.chatEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'empty-state ai-empty';
    div.innerHTML = `
